<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Statistics · Practice Room</title><link rel="stylesheet" href="lobby.css"><link rel="stylesheet" href="gradebook.css"><script src="cloud-config.js"></script><script src="practice-cloud.js" defer></script><script src="gradebook.js" defer></script></head>
<body class="gradebook-page"><header class="gradebook-header"><a href="index.html">← Dashboard</a><span>Practice Room</span><button id="lock" hidden>Lock</button></header><main><h1>Statistics</h1>
<section id="locked"><p id="connection-status" role="status">Open your private statistics link to view results.</p></section>
<section id="results" hidden><div class="stats-grid" id="stats"></div><div class="results-toolbar"><h2>Submitted attempts</h2><button id="refresh-results">Refresh</button></div><p id="results-status" role="status"></p><div class="table-scroll"><table><thead><tr><th>Device</th><th>Practice</th><th>Score</th><th>Time spent</th><th>Submitted</th></tr></thead><tbody id="results-body"></tbody></table></div><button id="load-more" hidden>Load more</button>
<section id="sharing" hidden><h2>Share statistics</h2><p>Create a separate read-only link for each person. Anyone with that link can view results until you revoke it.</p><form id="invite-form"><label for="viewer-label">Label</label><input id="viewer-label" required maxlength="80" placeholder="e.g. Teacher"><button type="submit">Create share link</button></form><p id="sharing-status" role="status"></p><div id="new-link" hidden><input id="share-url" readonly aria-label="New private share link"><button id="copy-link">Copy link</button></div><ul id="viewer-list"></ul></section>
</section><dialog id="attempt-detail"><button id="close-detail">Close</button><h2>Attempt details</h2><div id="detail-content"></div></dialog></main></body></html>
