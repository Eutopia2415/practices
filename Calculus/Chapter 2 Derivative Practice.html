<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <title>Chapter 2 · Test Prep progress check | AP Calculus AB</title>
  <style>
    :root {
      --page: #f8f7f2; --surface: #fff; --ink: #24342d; --muted: #637168;
      --border: #cbd2cc; --soft: #e8ebe7; --accent: #24342d;
      --success: #226447; --error: #9e3636; --focus: #c88730;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.45 Georgia, "Times New Roman", serif; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
      outline: 3px solid var(--focus); outline-offset: 3px;
    }
    .shell { height: 100dvh; min-height: 500px; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { display: flex; align-items: center; gap: 18px; flex: none; min-height: 63px; padding: 10px 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .brand { margin: 0; font-size: 23px; line-height: 1.15; }
    .topbar small { margin-left: auto; color: var(--muted); white-space: nowrap; font: 13px system-ui, sans-serif; }
    .button { min-height: 42px; padding: 9px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); font: 600 14px/1.3 system-ui, sans-serif; }
    .button:hover:not(:disabled) { background: #eff1ee; }
    .button.primary { background: var(--accent); border-color: var(--accent); color: var(--page); }
    .button.primary:hover:not(:disabled) { opacity: .86; background: var(--accent); }
    .button.subtle { border-color: transparent; background: transparent; }
    .button.subtle:hover { background: #eff1ee; }
    .mobile-tabs { display: none; }
    .layout { display: grid; grid-template-columns: minmax(0, 48%) minmax(0, 52%); flex: 1; min-height: 0; overflow: hidden; }
    .prompt-pane, .response-pane { min-width: 0; min-height: 0; overflow: auto; padding: 28px 32px 36px; }
    .prompt-pane { border-right: 1px solid var(--border); background: var(--surface); }
    .response-pane { align-self: stretch; background: var(--page); }
    .pane-title { margin: 0 0 6px; font-size: 26px; line-height: 1.2; }
    .eyebrow { margin: 0 0 18px; color: var(--muted); font: 700 12px/1.4 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
    .stem { margin: 22px 0; font-size: 21px; line-height: 1.55; }
    .stem p { margin: .2em 0 .8em; }
    .question-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .question-head h2 { margin: 0; font-size: 21px; }
    .flag { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font: 14px system-ui, sans-serif; }
    .flag input { width: 19px; height: 19px; accent-color: var(--accent); }
    .response-subtitle { margin: 0 0 17px; color: var(--muted); font: 14px/1.45 system-ui, sans-serif; }
    .choices { display: grid; gap: 10px; }
    .choice { display: flex; align-items: center; gap: 13px; min-height: 59px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); text-align: left; font-size: 17px; line-height: 1.4; }
    .choice:hover:not(:disabled) { background: #eff1ee; }
    .choice[aria-checked="true"] { border: 2px solid var(--accent); padding: 10px 13px; background: var(--soft); }
    .choice-letter { display: grid; place-items: center; flex: 0 0 30px; height: 30px; border: 1px solid var(--border); border-radius: 50%; font-size: 16px; }
    .choice[aria-checked="true"] .choice-letter { background: var(--accent); color: var(--page); border-color: var(--accent); }
    .utility { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; color: var(--muted); font: 13px system-ui, sans-serif; }
    .text-button { padding: 6px 0; border: 0; background: transparent; color: var(--ink); text-decoration: underline; font: 13px system-ui, sans-serif; }
    .feedback { margin: 20px 0 0; padding: 14px 16px; border-left: 3px solid var(--success); background: #eaf4ee; font-size: 15px; }
    .feedback.review { border-color: var(--error); background: #f9eded; }
    .parts { list-style: none; padding: 0; margin: 0; font-size: 17px; line-height: 1.55; }
    .parts li { margin: 0 0 18px; }
    .part-label { display: inline-block; min-width: 33px; font-weight: bold; }
    .upload { margin-top: 18px; padding: 18px; border: 1px dashed var(--border); border-radius: 8px; background: var(--surface); }
    .upload.drag { background: var(--soft); border-color: var(--accent); }
    .upload h3 { margin: 0 0 6px; font-size: 17px; }
    .upload p { margin: 0 0 12px; color: var(--muted); font: 13px/1.5 system-ui, sans-serif; }
    .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .thumbnails { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .thumb { width: 116px; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; background: var(--surface); }
    .thumb img { display: block; width: 100%; height: 90px; object-fit: cover; }
    .thumb-name { padding: 5px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px system-ui, sans-serif; }
    .thumb button { width: 100%; padding: 5px; border: 0; border-top: 1px solid var(--border); background: var(--surface); color: var(--error); font: 12px system-ui, sans-serif; }
    .written-label { display: block; margin: 20px 0 6px; font-weight: bold; }
    textarea { width: 100%; min-height: 150px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical; }
    .note { margin-top: 18px; color: var(--muted); font: 13px/1.5 system-ui, sans-serif; }
    .footer { display: flex; align-items: center; gap: 14px; flex: none; min-height: 70px; padding: 9px 28px; border-top: 1px solid var(--border); background: var(--surface); }
    .footer-progress { margin: 0 auto; color: var(--muted); white-space: nowrap; font: 13px system-ui, sans-serif; }
    .review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; margin: 22px 0; }
    .review-cell { min-height: 78px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); text-align: left; }
    .review-cell.answered { background: var(--soft); }
    .review-cell.flagged { border-top: 4px solid #ae7919; padding-top: 9px; }
    .review-cell small { display: block; margin-top: 4px; color: var(--muted); font: 12px system-ui, sans-serif; }
    .review-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .score { margin: 12px 0 0; font-size: 48px; line-height: 1.1; }
    .score span { font-size: 18px; color: var(--muted); }
    .result-info { max-width: 650px; color: var(--muted); }
    .summary { width: 100%; min-height: 145px; margin-top: 8px; font: 13px/1.45 ui-monospace, monospace; }
    .directions { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 16px; color: var(--muted); font: 13px/1.5 system-ui, sans-serif; }
    .directions summary { cursor: pointer; color: var(--ink); font-weight: bold; }
    .math { white-space: nowrap; }
    math { font-size: 1.12em; vertical-align: middle; }
    .choice math { font-size: 1.28em; }
    .equation-display { display: block; margin: .45em 0 .6em; font-size: 1.12em; overflow-x: auto; }
    .equation-display math { font-size: 1.3em; }
    .cases { display: grid; gap: 2px; margin: .4em 0 .55em 1em; padding-left: 12px; border-left: 3px solid var(--border); font-size: .98em; }
    .graph { display: block; width: min(100%, 440px); height: auto; margin: 14px 0 4px; border: 1px solid var(--border); border-radius: 8px; background: white; }
    .data-table { border-collapse: collapse; margin: 12px 0; max-width: 100%; font: 14px/1.35 system-ui, sans-serif; }
    .data-table th, .data-table td { border: 1px solid var(--border); padding: 5px 9px; text-align: center; white-space: nowrap; }
    .data-table th { background: var(--soft); }
    @media (max-width: 760px) {
      .topbar { padding: 12px 16px; min-height: 56px; }
      .brand { font-size: 19px; }
      .topbar small { display: none; }
      .mobile-tabs { display: flex; flex: none; border-bottom: 1px solid var(--border); background: var(--surface); }
      .mobile-tabs button { flex: 1; min-height: 44px; border: 0; background: var(--surface); color: var(--ink); }
      .mobile-tabs button[aria-selected="true"] { border-bottom: 3px solid var(--accent); }
      .layout { display: block; overflow: auto; }
      .prompt-pane, .response-pane { min-height: 100%; padding: 22px 18px 32px; overflow: visible; }
      .prompt-pane { border: 0; }
      .response-pane { background: var(--surface); }
      .layout[data-mobile-view="prompt"] .response-pane, .layout[data-mobile-view="response"] .prompt-pane { display: none; }
      .stem { font-size: 19px; }
      .footer { padding: 9px 14px; gap: 8px; }
      .footer .button { padding: 8px 10px; font-size: 13px; }
      .footer-progress { font-size: 12px; }
    }
    @media (max-width: 420px) { .footer-progress { display: none; } .footer .button:nth-child(3) { margin-left: auto; } }
  </style>
</head>

    const mcq=[
      {skill:'Differentiability at a corner',q:'Let <span class="math">h(x)=|x−1|+2</span>. A student says that <span class="math">h′(1)=0</span> because <span class="math">h</span> has a minimum at <span class="math">x=1</span>. Which statement correctly evaluates the student’s claim?',choices:['The claim is correct because every minimum has a horizontal tangent.','The claim is correct because h is continuous at x=1.','The claim is incorrect because h is discontinuous at x=1.','The claim is incorrect because the left and right slopes at x=1 are −1 and 1.','The claim is incorrect because h(1) is undefined.'],answer:3,why:'The function is continuous at 1, but its one-sided slopes are −1 and 1. A minimum at a corner need not have a derivative.'},

    const frq=[
      {title:'A derivative hidden in a limit',points:9,intro:`Let <span class="math">L</span> be the limit <span class="equation-display">${M('<munder><mo>lim</mo><mrow><mi>h</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mrow><msqrt><mrow><mn>25</mn><mo>+</mo><mi>h</mi></mrow></msqrt><mo>−</mo><mn>5</mn></mrow><mi>h</mi></mfrac>')}</span><p>A student states that <span class="math">L=0</span> because the numerator approaches zero.</p>`,parts:['Identify a function <span class="math">F</span> and an input <span class="math">c</span> for which <span class="math">L=F′(c)</span>. Evaluate <span class="math">L</span> using limit algebra, showing the step that removes the indeterminate form.','Write equations for the tangent line and the normal line to the graph of <span class="math">y=√x</span> at <span class="math">x=25</span>.','Explain why the student’s reasoning does not determine the value of <span class="math">L</span>.',`For <span class="math">a&gt;0</span>, evaluate <span class="equation-display">${M('<munder><mo>lim</mo><mrow><mi>h</mi><mo>→</mo><mn>0</mn></mrow></munder><mfrac><mrow><msqrt><mrow><mi>a</mi><mo>+</mo><mi>h</mi></mrow></msqrt><mo>−</mo><msqrt><mi>a</mi></msqrt></mrow><mi>h</mi></mfrac>')}</span>Explain why the same finite two-sided derivative argument does not apply at <span class="math">a=0</span>.`]},

      {title:'A piecewise join',points:9,intro:'For constants <span class="math">m</span> and <span class="math">c</span>, define <span class="cases"><span>p(x)=x²+2, &nbsp; x≤1</span><span>p(x)=mx+c, &nbsp; x&gt;1</span></span>A student chooses <span class="math">m=2</span> and <span class="math">c=0</span> because the slopes on both sides of <span class="math">x=1</span> are then 2.',parts:['Find the condition on <span class="math">m</span> and <span class="math">c</span> that makes <span class="math">p</span> continuous at <span class="math">x=1</span>.','Find the values of <span class="math">m</span> and <span class="math">c</span> that make <span class="math">p</span> differentiable at <span class="math">x=1</span>. Justify both requirements.','For the student’s values, determine whether <span class="math">p′(1)</span> exists. Explain why matching the slopes of the two formulas is insufficient.']},
      {title:'Position, velocity, and distance',points:9,intro:'A particle moves along a horizontal line. Its position at time <span class="math">t</span> seconds is <span class="math">s(t)=t³−3t²</span> meters for <span class="math">0≤t≤3</span>. A student says the total distance traveled is zero because the particle ends where it started.',parts:['Find the velocity <span class="math">v(t)</span> and acceleration <span class="math">a(t)</span>. Include units.','Determine all times in <span class="math">[0,3]</span> at which the particle is at rest.','Find the displacement and total distance traveled over <span class="math">[0,3]</span>. Show the position values used and include units.','Explain the flaw in the student’s statement.']},
      {title:'Product-rule tangent and second derivative',points:9,intro:'Let <span class="math">g(x)=x²f(x)</span>, where <span class="math">f</span> is twice differentiable. The table gives <span class="math">f(2)=5</span>, <span class="math">f′(2)=−3</span>, and <span class="math">f″(2)=4</span>. A student proposes <span class="math">y−5=−3(x−2)</span> as the tangent line to <span class="math">g</span> at <span class="math">x=2</span>.',parts:['Find <span class="math">g(2)</span> and <span class="math">g′(2)</span>. Show how the product rule is used.','Write an equation for the line tangent to the graph of <span class="math">g</span> at <span class="math">x=2</span>.','Find <span class="math">g″(2)</span>. Show the rule or expression used.','Explain both errors in the student’s proposed tangent line.']},
      {title:'Quotient and trigonometric rates',points:9,intro:'For <span class="math">x&gt;−1</span>, let <span class="math">R(x)=sin x/(x+1)</span>, with angles measured in radians. A student says that <span class="math">R′(π/2)=0</span> because <span class="math">sin x</span> has a maximum at <span class="math">x=π/2</span>.',parts:['Find <span class="math">R′(x)</span>. Show the work that leads to your answer.','Find <span class="math">R′(π/2)</span> and use it to assess the student’s claim. Explain the mathematical flaw.','Write an equation for the line tangent to the graph of <span class="math">R</span> at <span class="math">x=0</span>.']},
      {title:'Nested chain and product rules',points:9,intro:'Let <span class="math">H(x)=x sin(x²)</span> for <span class="math">x≥0</span>. A student says the tangent line at <span class="math">x=√π</span> must be horizontal because <span class="math">H(√π)=0</span>.',parts:['Find <span class="math">H′(x)</span>, showing where both the product and chain rules are used.','Find <span class="math">H(√π)</span> and <span class="math">H′(√π)</span>, and write an equation for the tangent line there.','Explain why the student’s conclusion does not follow from <span class="math">H(√π)=0</span>.','Find <span class="math">H″(√π)</span>. Show the differentiation that supports your value.']}
    ];
    const fresh = () => ({choices:Array(mcq.length).fill(null), texts:Array(frq.length).fill(''), flags:Array(mcq.length+frq.length).fill(false), active:0, view:'question', submitted:false, startedAt:Date.now()});
    let state = fresh();
    let storageOK = true;
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (Array.isArray(saved.choices) && saved.choices.length === mcq.length) state.choices = saved.choices.map(x => Number.isInteger(x) && x >= 0 && x < 5 ? x : null);
      if (Array.isArray(saved.texts)) state.texts = frq.map((_,i) => typeof saved.texts[i] === 'string' ? saved.texts[i] : '');
      if (Array.isArray(saved.flags)) state.flags = state.flags.map((_,i) => saved.flags[i] === true);
      if (Number.isInteger(saved.active) && saved.active >= 0 && saved.active < state.flags.length) state.active = saved.active;
      if (Number.isFinite(saved.startedAt)) state.startedAt = saved.startedAt;
      state.submitted = saved.submitted === true;
      state.view = state.submitted ? (saved.view === 'question' ? 'question' : 'results') : (saved.view === 'review' ? 'review' : 'question');
    } catch (error) { storageOK = false; }
    let dbPromise;
    let photoCache = [];
    let mobileView = 'prompt';
    const $ = id => document.getElementById(id);
    const total = mcq.length + frq.length;
    function db() {
      if (!dbPromise) dbPromise = new Promise((resolve,reject) => {
        const req = indexedDB.open(DB,1);
        req.onupgradeneeded = () => req.result.createObjectStore('photos',{keyPath:'id'});
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }
    async function photosTransaction(mode, method, value) {
      const database = await db();
      return new Promise((resolve,reject) => {
        const req = database.transaction('photos',mode).objectStore('photos')[method](...(value === undefined ? [] : [value]));
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    const allPhotos = () => photosTransaction('readonly','getAll');
    const savePhoto = record => photosTransaction('readwrite','put',record);
    const deletePhoto = id => photosTransaction('readwrite','delete',id);
    const clearPhotos = () => photosTransaction('readwrite','clear');
    function persist() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (error) { storageOK = false; }
      updateNav();
    }
    function isDone(i) { return i < mcq.length ? state.choices[i] !== null : !!(state.texts[i-mcq.length].trim() || photoCache.some(p => p.frq === i-mcq.length)); }
    function updateNav() {
      const done = Array.from({length:total},(_,i) => isDone(i)).filter(Boolean).length;
      $('progress').textContent = `${done} of ${total} answered`;
      $('backBtn').disabled = state.view === 'question' && state.active === 0;
      $('backBtn').textContent = state.view === 'question' ? 'Back' : 'Questions';
      $('reviewBtn').textContent = state.submitted ? 'Results' : 'Review answers';
      $('nextBtn').textContent = state.view === 'question' ? (state.active === total-1 ? (state.submitted ? 'Results' : 'Review answers') : 'Next') : (state.submitted ? 'Review MCQ' : 'Return to question');
    }
    function setMobileView(view) {
      mobileView = view;
      $('layout').dataset.mobileView = view;
      $('promptTab').setAttribute('aria-selected',view === 'prompt');
      $('responseTab').setAttribute('aria-selected',view === 'response');
      $('layout').scrollTop = 0;
    }
    function directions() { return `<details class="directions"><summary>Directions</summary><p>No calculator is required. Use radians for trigonometry. Label each free-response part. Show setup, supporting work, mathematical reasons, and units for contextual rates. Unless specified otherwise, exact expressions need not be simplified; decimal approximations should be accurate to three places after the decimal point.</p><p>These are original questions, not an official AP Classroom assignment or AP exam. The directions follow the <a href="https://apcentral.collegeboard.org/media/pdf/ap26-frq-calculus-ab.pdf" target="_blank" rel="noopener noreferrer">published AP Calculus AB free-response directions</a>.</p></details>`; }
    function questionHeader(i) { return `<div class="question-head"><h2>Question ${i+1} of ${total}</h2><label class="flag"><input id="flag" type="checkbox" ${state.flags[i]?'checked':''}>Mark for review</label></div>`; }
    function renderQuestion() {
      const i = state.active;
      if (i < mcq.length) {
        const q = mcq[i];
        $('promptPane').innerHTML = `<p class="eyebrow">Multiple choice · No calculator · 1 point</p><h2 class="pane-title">Question ${i+1}</h2><div class="stem">${q.q}</div>${directions()}`;
        $('responsePane').innerHTML = `${questionHeader(i)}<p class="response-subtitle">Choose one answer.</p><div class="choices" role="radiogroup" aria-label="Answer choices">${q.choices.map((c,j) => `<button class="choice" type="button" role="radio" aria-checked="${state.choices[i]===j}" data-choice="${j}" ${state.submitted?'disabled':''}><span class="choice-letter">${letters[j]}</span><span>${c}</span></button>`).join('')}</div>${state.submitted ? `<div class="feedback ${state.choices[i]===q.answer?'':'review'}"><strong>${state.choices[i]===q.answer?'Correct':state.choices[i]===null?'Unanswered':'Review this one'} · Answer: ${letters[q.answer]}</strong><p>${q.why}</p></div>` : `<div class="utility"><span>${storageOK?'Progress saved in this browser':'Browser storage unavailable; download your attempt'}</span><button class="text-button" id="clearAnswer" type="button">Clear answer</button></div>`}`;
      } else {
        const n = i - mcq.length, q = frq[n], mine = photoCache.filter(p => p.frq === n);
        $('promptPane').innerHTML = `<p class="eyebrow">Free response · No calculator · ${q.points} points</p><h2 class="pane-title">Question ${i+1}</h2><div class="stem">${q.intro}</div>${directions()}`;
        $('responsePane').innerHTML = `${questionHeader(i)}<ol class="parts">${q.parts.map((p,j) => `<li><span class="part-label">(${letters[j].toLowerCase()})</span>${p}</li>`).join('')}</ol><label class="written-label" for="writtenAnswer">Your written work</label><textarea id="writtenAnswer" placeholder="Type your work here, attach photos, or both." ${state.submitted?'readonly':''}></textarea><div class="upload" id="dropZone"><h3>Attach photos of your work</h3><p>Images stay in this browser and are included in the downloaded attempt. Multiple pages are fine.</p>${state.submitted?'':`<label class="button" for="photoInput">Choose photos</label><input class="file-input" id="photoInput" type="file" accept="image/*" multiple>`}<div class="thumbnails" id="thumbnails"></div></div><p class="note">${state.submitted?'FRQs need written grading. Download your attempt for feedback.':storageOK?'Written work saves as you type.':'Browser storage unavailable; download your attempt.'}</p>`;
        $('writtenAnswer').value = state.texts[n];
        $('thumbnails').replaceChildren(...mine.map(p => {
          const box = document.createElement('div'); box.className = 'thumb';
          const img = document.createElement('img'); img.alt = p.name; img.src = URL.createObjectURL(p.blob); img.onload = () => URL.revokeObjectURL(img.src);
          const name = document.createElement('div'); name.className = 'thumb-name'; name.textContent = p.name;
          box.append(img,name);
          if (!state.submitted) { const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = 'Remove'; remove.onclick = async () => { await deletePhoto(p.id); await render(); }; box.append(remove); }
          return box;
        }));
        if (!state.submitted) {
          $('writtenAnswer').oninput = e => { state.texts[n] = e.target.value; persist(); };
          $('photoInput').onchange = e => addFiles(e.target.files,n);
          const drop = $('dropZone');
          drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
          drop.ondragleave = () => drop.classList.remove('drag');
          drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag'); addFiles(e.dataTransfer.files,n); };
        }
      }
      $('flag').onchange = e => { state.flags[i] = e.target.checked; persist(); };
    }
    function reviewGrid(results) { return `<div class="review-grid">${Array.from({length:total},(_,i) => `<button class="review-cell ${isDone(i)?'answered':''} ${state.flags[i]?'flagged':''}" type="button" data-go="${i}"><strong>${i<mcq.length?`MCQ ${i+1}`:`FRQ ${i-mcq.length+1}`}</strong><small>${results&&i<mcq.length?(state.choices[i]===mcq[i].answer?'Correct':state.choices[i]===null?'Unanswered':'Review'):(i<mcq.length ? (state.choices[i]===null?'Unanswered':`Answer ${letters[state.choices[i]]}`) : (isDone(i)?'Work saved':'Unanswered'))}${state.flags[i]?' · Flagged':''}</small></button>`).join('')}</div>`; }
    function renderReview() {
      const missing = Array.from({length:total},(_,i) => !isDone(i)).filter(Boolean).length, flagged = state.flags.filter(Boolean).length;
      $('promptPane').innerHTML = `<p class="eyebrow">Before you submit</p><h2 class="pane-title">Review your work</h2><p>${missing} unanswered · ${flagged} marked for review.</p><p>Select a question to return to it. A gold top border marks questions you flagged.</p>${directions()}`;
      $('responsePane').innerHTML = `<h2 class="pane-title">All questions</h2>${reviewGrid(false)}<p class="note">Submission locks this attempt and scores the multiple-choice questions. Free responses need written grading.</p><div class="review-actions"><button class="button primary" id="submitBtn" type="button">Submit ${missing?`with ${missing} unanswered`:'attempt'}</button><button class="button" id="keepWorking" type="button">Keep working</button></div>`;
      $('submitBtn').onclick = () => { state.submitted = true; state.view = 'results'; persist(); render(); setMobileView('response'); };
      $('keepWorking').onclick = () => { state.view = 'question'; persist(); render(); };
    }
    function summaryText() { return `AP Calculus AB Chapter 2 Test Prep progress check\nMultiple choice: ${state.choices.filter((x,i)=>x===mcq[i].answer).length}/${mcq.length}\nFree responses require written grading.\n\n${Array.from({length:total},(_,i)=>`${i<mcq.length?`MCQ ${i+1}`:`FRQ ${i-mcq.length+1}`}: ${i<mcq.length?(state.choices[i]===null?'Unanswered':letters[state.choices[i]]):(isDone(i)?'Work saved':'Unanswered')} | flagged: ${state.flags[i]?'yes':'no'}`).join('\n')}\n\nDownload the attempt to include typed answers and photos.`; }
    function renderResults() {
      const score = state.choices.filter((x,i) => x === mcq[i].answer).length;
      $('promptPane').innerHTML = `<p class="eyebrow">Attempt submitted</p><h2 class="pane-title">Practice complete</h2><p class="result-info">Your multiple-choice answers have been scored. Free responses need written grading. This score is for this practice set, not a predicted AP exam score.</p>${directions()}`;
      $('responsePane').innerHTML = `<h2 class="pane-title">Your results</h2><div class="score">${score} / ${mcq.length} <span>multiple choice</span></div><p class="result-info">Your written work and photos remain saved in this browser. Download the attempt when you want feedback.</p><div class="review-actions"><button class="button primary" id="downloadBtn" type="button">Download attempt</button><button class="button" id="copyBtn" type="button">Copy summary</button><button class="button" id="startOverBtn" type="button">Start over</button></div><p id="copyStatus" class="note" role="status"></p><h3>Question review</h3>${reviewGrid(true)}<details><summary>View answer summary</summary><textarea class="summary" readonly>${summaryText()}</textarea></details>`;
      $('downloadBtn').onclick = download;
      $('copyBtn').onclick = async () => { try { await navigator.clipboard.writeText(summaryText()); $('copyStatus').textContent = 'Copied. Paste this into our conversation for diagnosis.'; } catch { $('copyStatus').textContent = 'Copy from the answer summary below.'; } };
      $('startOverBtn').onclick = resetAttempt;
    }
    async function render() {
      try { photoCache = await allPhotos(); } catch (error) { photoCache = []; console.warn('Photo storage unavailable',error); }
      if (state.view === 'review') renderReview(); else if (state.view === 'results') renderResults(); else renderQuestion();
      updateNav();
    }
    async function addFiles(files,n) {
      for (const file of files) {
        if (!file.type.startsWith('image/')) { alert(`${file.name} is not an image.`); continue; }
        if (file.size > 15*1024*1024) { alert(`${file.name} is larger than 15 MB.`); continue; }
        try { await savePhoto({id:crypto.randomUUID(),frq:n,name:file.name,type:file.type,blob:file,addedAt:new Date().toISOString()}); }
        catch (error) { alert('This browser could not save the photo. Attach it in chat separately. '+error.message); break; }
      }
      await render();
    }
    function go(i) { if (i < 0 || i >= total) return; state.active = i; state.view = 'question'; persist(); render(); setMobileView('prompt'); $('layout').scrollTop = 0; $('promptPane').scrollTop = 0; $('responsePane').scrollTop = 0; }
    async function resetAttempt() { if (!confirm('Start over? This erases the answers and photos saved in this browser. Download your attempt first if you want to keep it.')) return; try { await clearPhotos(); } catch (error) { alert('Photos could not be cleared: '+error.message); return; } state = fresh(); persist(); await render(); setMobileView('prompt'); }
    function fileAsDataURL(blob) { return new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(reader.error); reader.readAsDataURL(blob); }); }
    function readableText(html) { const holder = document.createElement('template'); holder.innerHTML = html; function visit(node) { if (node.nodeType === Node.TEXT_NODE) return node.textContent; const tag = node.localName; if (tag === 'svg') return ' '+(node.getAttribute('aria-label')||'graph')+' '; if (tag === 'msqrt') return 'sqrt('+Array.from(node.childNodes,visit).join('')+')'; if (tag === 'mfrac') return '('+visit(node.children[0])+')/('+visit(node.children[1])+')'; if (tag === 'msup') return visit(node.children[0])+'^('+visit(node.children[1])+')'; if (tag === 'br') return ' '; if (tag === 'tr') return Array.from(node.children,visit).join(' | ')+'; '; if (node.classList?.contains('cases')) return Array.from(node.children,visit).join('; '); if (node.classList?.contains('equation-display')) return ' '+Array.from(node.childNodes,visit).join('')+' '; return Array.from(node.childNodes,visit).join(''); } return visit(holder.content).replace(/\s+/g,' ').trim(); }
    async function download() {
      let photos; try { photos = await allPhotos(); } catch (error) { alert('Saved photos could not be read. Attach them in chat separately.'); return; }
      const encoded = []; for (const p of photos) encoded.push({frq:p.frq+1,name:p.name,type:p.type,addedAt:p.addedAt,dataUrl:await fileAsDataURL(p.blob)});
      const payload = {title:'AP Calculus AB Chapter 2 Test Prep progress check',version:9,exportedAt:new Date().toISOString(),submitted:state.submitted,flags:state.flags,mcqAnswers:state.choices.map((x,i)=>({question:i+1,prompt:readableText(mcq[i].q),choice:x===null?null:letters[x],selectedText:x===null?null:readableText(mcq[i].choices[x])})),frqAnswers:state.texts.map((x,i)=>({question:i+1,prompt:readableText(frq[i].intro),parts:frq[i].parts.map(readableText),typedAnswer:x})),photos:encoded};
      const url = URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})); const a = document.createElement('a'); a.href = url; a.download = 'AP_Calc_Ch2_Test_Prep_Attempt.json'; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000);
    }
    document.addEventListener('click',e => {
      const choice = e.target.closest('[data-choice]');
      if (choice && !state.submitted) { state.choices[state.active] = Number(choice.dataset.choice); persist(); render(); return; }
      if (e.target.closest('#clearAnswer') && !state.submitted) { state.choices[state.active] = null; persist(); render(); return; }
      const cell = e.target.closest('[data-go]'); if (cell) go(Number(cell.dataset.go));
    });
    $('promptTab').onclick = () => setMobileView('prompt');
    $('responseTab').onclick = () => setMobileView('response');
    $('backBtn').onclick = () => { if (state.view !== 'question') { state.view = 'question'; persist(); render(); setMobileView('prompt'); } else go(state.active-1); };
    $('nextBtn').onclick = () => { if (state.view === 'question') { if (state.active < total-1) go(state.active+1); else { state.view = state.submitted ? 'results' : 'review'; persist(); render(); setMobileView('response'); } } else if (state.submitted) go(0); else { state.view = 'question'; persist(); render(); setMobileView('prompt'); } };
    $('reviewBtn').onclick = () => { state.view = state.submitted ? 'results' : 'review'; persist(); render(); setMobileView('response'); };
    render();
  })();
  </script>
</body>
</html>
