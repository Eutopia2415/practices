<script>
const bank={"id":"business-unit1-fresh-20260924","title":"AP Business Unit 1 Worksheet","revision":"548a63e9be5af4c79cf01026e6bfdd1c19127d7e12a49241164b0ea38a579df5","minutes":35,"storage_id":"ap-business-business-unit1-fresh-20260924-548a63e9be5af4c7","cases":[{"title":"Case 1 · BlueSteps","paragraphs":["BlueSteps makes short audio guides that help new residents navigate bus routes and public services. A city library buys annual access for its branches; library visitors use the guides at no charge.","In a four-week trial, visitors repeatedly used the route guides and asked library staff fewer basic travel questions. Librarians said the most useful feature was that each instruction could be replayed in the visitor's preferred language."]},{"title":"Case 2 · BoxCycle","paragraphs":["BoxCycle rents reusable moving boxes to students. Each rental costs $28; cleaning, collection, and delivery cost $12 per rental. In a survey, one student said she would pay as much as $36 for the service.","During its first month BoxCycle completed 50 rentals. Its fixed monthly costs, including storage and insurance, were $1,000. Assume every rental had the same price and variable cost, and that there were no other revenues or costs."]},{"title":"Case 3 · Seed Market","paragraphs":["At the Saturday market, many stalls sell essentially identical herb seedling kits. At $10 per kit, buyers want 300 kits and sellers offer 180. At $12, buyers want 220 and sellers offer 220. At $14, buyers want 180 and sellers offer 260.","A new stall considers charging $15 for the same kit while nearby stalls continue to charge $12. Buyers can easily compare prices and switch stalls. Assume the listed quantities describe this market on the same Saturday, with other conditions unchanged."]},{"title":"Case 4 · NorthThread","paragraphs":["NorthThread sells premium repairable cycling gloves only to winter commuters in mountain towns. Its distinctive fastening system makes wet gloves easier to remove. Interviews show that these commuters value the feature and are willing to pay more for it.","NorthThread holds a patent on the fastening mechanism. Its total production cost is $2,200 for 100 pairs and $3,600 for 200 pairs in a month. Assume the pairs are comparable and that these totals include all production costs at each output level."]},{"title":"Case 5 · RiverPantry","paragraphs":["RiverPantry assembles meal kits using vegetables from nearby farms. A long heatwave cuts the farms' harvest, raising the price RiverPantry pays for vegetables. The firm has not yet changed its kit price.","New route-planning software could reduce delivery mileage and fuel cost. A binding food-label rule also takes effect next month and requires a new label on every kit, adding a packaging cost. RiverPantry can choose whether to buy the software, but it must obey the rule."]},{"title":"Case 6 · SkillBridge","paragraphs":["SkillBridge plans evening training classes for older adults who want to change careers. The share of older residents in its area is growing, but the firm has only survey responses about interest; it has not yet recorded any paid enrollment.","Interest rates have risen, so the loan needed to equip classrooms would cost more. The city mayor has announced a possible grant for adult training, but the council has not approved it and no grant money is available. SkillBridge can start with one rented classroom before borrowing for a larger center."]}],"questions":[{"n":1,"stem":"For the access described in Case 1, who is the customer and who is the consumer?","options":["The library is the customer; the visitors are consumers.","Visitors are both the customers and consumers because they use the guides.","BlueSteps is the customer; the library is the consumer.","The library is both the customer and consumer because it distributes access."],"case_index":0},{"n":2,"stem":"Which evidence gives the strongest support for problem-solution fit among the intended users?","options":["BlueSteps offers audio instead of printed text.","Visitors repeatedly used the guides and asked staff fewer travel questions.","The library signed an annual purchasing agreement.","The guides cover bus routes and public services."],"case_index":0},{"n":3,"stem":"Which proposed value proposition best matches the trial evidence?","options":["The cheapest library product, regardless of visitor use.","A way for libraries to eliminate every staff travel question.","Replayable guides in preferred languages that help visitors navigate with less staff help.","A premium entertainment service for residents who already know the routes."],"case_index":0},{"n":4,"stem":"How much value does BoxCycle capture per rental before fixed monthly costs?","options":["$12","$16 of monthly profit","$28","$16 per rental"],"case_index":1},{"n":5,"stem":"For the surveyed student, what would consumer surplus be if she rented at the stated price?","options":["$8","$12","$16","$36"],"case_index":1},{"n":6,"stem":"What was BoxCycle's first-month profit under the case assumptions?","options":["$800 profit","$200 loss","$400 profit","$1,400 profit"],"case_index":1},{"n":7,"stem":"At $10 per kit, what market condition exists and what pressure would it create on price?","options":["A 120-kit surplus and downward pressure","A 120-kit shortage and downward pressure","A 120-kit shortage and upward pressure","An 80-kit surplus and upward pressure"],"case_index":2},{"n":8,"stem":"Which listed price is the equilibrium price for this Saturday market?","options":["$10 because demand is highest there","$14 because sellers offer the most there","$15 because the new stall wants to charge it","$12 because quantity demanded equals quantity supplied"],"case_index":2},{"n":9,"stem":"What most limits the new stall's ability to keep charging $15 for an identical kit?","options":["Buyers can switch easily to stalls selling the same kit for $12.","The market has an equilibrium price, so no seller may legally charge more.","Any price above $12 automatically increases the new stall's profit.","The stall has a patent on its kit."],"case_index":2},{"n":10,"stem":"Which competitive strategy best describes NorthThread's current approach?","options":["Cost leadership across all glove buyers","Differentiation focus for winter commuters","Cost focus for winter commuters","Broad differentiation for all glove buyers"],"case_index":3},{"n":11,"stem":"How could the patent most directly help NorthThread sustain its advantage?","options":["It proves every customer will buy the gloves.","It ensures total production cost falls as output rises.","It can make legal copying of the fastening mechanism harder for rivals.","It prevents all rival glove designs from entering the market."],"case_index":3},{"n":12,"stem":"What do the production-cost figures show about economies of scale?","options":["No: total cost rose by $1,400.","No: cost per pair stayed $22.","Yes: total cost fell by $4 per pair.","Yes: average cost fell from $22 to $18 per pair."],"case_index":3},{"n":13,"stem":"Which PESTEL factor is most directly represented by the heatwave, and how does it affect RiverPantry?","options":["Environmental; scarcer vegetables raise input costs and squeeze the margin if price stays fixed.","Social; a change in food tastes raises demand and margin.","Legal; the heatwave creates a new mandatory label.","Technological; the heatwave reduces delivery mileage."],"case_index":4},{"n":14,"stem":"Which statement best explains the software's potential effect on RiverPantry's viability?","options":["It is a legal requirement that eliminates packaging cost.","It is a technological opportunity that may lower delivery costs if savings exceed its purchase cost.","It is a social trend that guarantees more customers.","It is an environmental event that restores the lost vegetable harvest."],"case_index":4},{"n":15,"stem":"Why is the new labeling requirement primarily a legal factor?","options":["It reflects a customer's preferred packaging style.","It is an optional business decision about product design.","It is a binding rule RiverPantry must obey, adding cost per kit.","It is a mayor's proposal with no current effect."],"case_index":4},{"n":16,"stem":"Which pair correctly classifies the growing share of older residents and the higher loan interest rate?","options":["Political and legal","Environmental and technological","Economic and social","Social and economic"],"case_index":5},{"n":17,"stem":"How should SkillBridge treat the mayor's grant announcement in a viability forecast?","options":["As a possible political opportunity, without counting unapproved funds as current revenue.","As an enforceable legal entitlement to grant money.","As proof that the training classes have problem-solution fit.","As an economic cost that already raised the loan interest rate."],"case_index":5},{"n":18,"stem":"Which launch decision is best supported by the case if SkillBridge wants to protect long-run viability?","options":["Borrow for the large center immediately because survey interest proves paid demand.","Try one rented classroom, measure paid enrollment, then decide whether demand can cover the higher borrowing cost.","Cancel the idea because a higher interest rate means demand must be zero.","Count the proposed grant as cash and build the center before enrollment begins."],"case_index":5}],"key":["A","B","C","D","A","B","C","D","A","B","C","D","A","B","C","D","A","B"],"explanations":["The library purchases access, while visitors use the guides; buyer and user differ here.","Repeat use together with fewer travel questions shows that the guides address a real user difficulty, beyond the idea or purchase alone.","The preferred-language replay feature and fewer staff questions connect a concrete benefit to the library's visitors.","$28 rental price minus $12 variable cost equals $16 per rental before fixed costs.","Her stated willingness to pay is $36 and the rental price is $28, so consumer surplus is $8.","Revenue was 50 × $28 = $1,400; variable cost was 50 × $12 = $600; with $1,000 fixed cost, profit was $1,400 − $600 − $1,000 = −$200.","Quantity demanded exceeds quantity supplied by 300 − 180 = 120 kits; buyers competing for scarce kits create upward price pressure.","At $12, both quantity demanded and quantity supplied equal 220 kits, which defines equilibrium in the table.","Identical rival kits and easy comparison make buyers likely to switch to $12 stalls, limiting the new stall's market power.","NorthThread serves a narrow group and offers a valued distinctive fastening feature at a premium, so it uses differentiation focus.","The patent can restrict rivals from copying the protected mechanism, creating a barrier around the feature valued by the target customers.","Average production cost is $2,200/100 = $22 per pair, then $3,600/200 = $18 per pair. Falling average cost as output rises shows economies of scale.","The heatwave is an environmental event; the smaller harvest raises input prices, so an unchanged kit price leaves less margin.","Route-planning software is a technological change that could lower fuel costs; the net benefit depends on the software's cost.","The rule has taken effect and imposes a required label; compliance adds packaging cost, making it a legal factor.","Population age is a social demographic trend; the interest rate is an economic condition that changes borrowing cost.","A proposed grant reflects a political priority, but the council has not approved it and no money is available.","A small rented pilot tests paid demand while limiting exposure to the higher loan cost; expansion can follow if enrollment and margins support it."]};
const questions=bank.questions, answerKey=bank.key, explanations=bank.explanations;
const total=questions.length, limit=bank.minutes*60;
const STORE=bank.storage_id;
const fresh=()=>({answers:Array(total).fill(null),flags:Array(total).fill(false),confidence:Array(total).fill(null),index:0,view:'question',seconds:limit,deadline:null,submitted:false,notes:'',elapsed:0,startedAt:null});
let state=fresh(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&Array.isArray(saved.answers)&&saved.answers.length===total&&saved.answers.every(a=>a===null||'ABCD'.includes(a))&&Array.isArray(saved.flags)&&saved.flags.length===total&&Array.isArray(saved.confidence)&&saved.confidence.length===total&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<total&&['question','review','results'].includes(saved.view)&&Number.isFinite(saved.seconds)&&saved.seconds>=0&&saved.seconds<=limit)state=Object.assign(fresh(),saved)}catch(e){storageOK=false}
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){storageOK=false}}
function timerUpdate(){if(state.deadline&&!state.submitted){state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if(!state.seconds){state.deadline=null;save();render()}}el('clock').textContent=String(Math.floor(state.seconds/60)).padStart(2,'0')+':'+String(state.seconds%60).padStart(2,'0');el('clock').classList.toggle('expired',state.seconds===0);el('timer-button').textContent=state.submitted?'Finished':state.deadline?'Pause timer':state.seconds===0?'Time elapsed':state.seconds===limit?'Start timer':'Resume timer';el('timer-button').disabled=state.submitted||state.seconds===0}
el('timer-button').onclick=()=>{if(state.deadline){timerUpdate();state.deadline=null}else{state.deadline=Date.now()+state.seconds*1000;if(!state.startedAt)state.startedAt=Date.now()}save();timerUpdate()};
let displayedCase=-1;
function showCase(index){const c=bank.cases[index];if(displayedCase===index)return;displayedCase=index;el('case-title').textContent=c.title;el('case-body').innerHTML=c.paragraphs.map(p=>'<p class="case-paragraph">'+esc(p)+'</p>').join('');document.querySelector('.passage').scrollTop=0;}
showCase(questions[state.index].case_index);
function mobileView(showCaseStudy){document.body.classList.toggle('show-poem',showCaseStudy);el('case-tab').setAttribute('aria-selected',showCaseStudy);el('question-tab').setAttribute('aria-selected',!showCaseStudy)}
el('case-tab').onclick=()=>mobileView(true);el('question-tab').onclick=()=>mobileView(false);
function go(n){state.index=n;state.view='question';save();render();el('panel').scrollTop=0;mobileView(false)}
function score(){return state.answers.reduce((total,a,i)=>total+(a===answerKey[i]?1:0),0)}
function nav(){el('progress').textContent=state.answers.filter(Boolean).length+' of '+total+' answered';el('back').disabled=state.view==='question'&&state.index===0;el('back').textContent=state.view==='question'?'Back':'Questions';el('next').textContent=state.view==='question'?(state.index===total-1?(state.submitted?'Results':'Review answers'):'Next'):(state.submitted?'Review explanations':'Return to question');el('review').textContent=state.submitted?'Results':'Review answers';}
function render(){
nav();timerUpdate();showCase(questions[state.index].case_index);const panel=el('panel');
if(state.view==='review'){renderReview();return}if(state.view==='results'){renderResults();return}
const q=questions[state.index],a=state.answers[state.index],i=state.index;
panel.innerHTML='<div class="q-head"><h2 id="question-title">Question '+q.n+' of '+total+'</h2><label class="flag-label"><input id="flag" type="checkbox" '+(state.flags[i]?'checked':'')+'>Mark for review</label></div><p class="stem" id="stem">'+esc(q.stem)+'</p><div class="options" role="radiogroup" aria-labelledby="stem">'+q.options.map((text,k)=>{const l=String.fromCharCode(65+k);return '<button class="option" role="radio" aria-checked="'+(a===l)+'" data-choice="'+l+'" '+(state.submitted?'disabled':'')+'><span class="letter">'+l+'</span><span class="option-text">'+esc(text)+'</span></button>'}).join('')+'</div>'+
(!state.submitted?'<div class="confidence"><p>Confidence (optional)</p><div class="segments">'+['Low','Medium','High'].map(c=>'<button data-confidence="'+c+'" aria-pressed="'+(state.confidence[i]===c)+'">'+c+'</button>').join('')+'</div></div><div class="utility"><span>'+(!storageOK?'Browser storage unavailable; keep this page open.':'Progress saved in this browser')+'</span><button class="textbutton" id="clear">Clear answer</button></div>':'<div class="feedback"><strong class="'+(a===answerKey[i]?'correct':'incorrect')+'">'+(a===answerKey[i]?'Correct':a?'Your answer: '+a:'Unanswered')+' · Answer: '+answerKey[i]+'</strong>'+esc(explanations[i])+'</div>')+
(state.seconds===0&&!state.submitted?'<p class="timer-message" role="status">The suggested '+bank.minutes+' minutes have elapsed. Your answers are safe. You can finish or review at your own pace.</p>':'');
el('flag').onchange=e=>{state.flags[i]=e.target.checked;save()};
panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=b.dataset.choice;save();render();el('panel').querySelector('[data-choice="'+state.answers[i]+'"]').focus({preventScroll:true})});
panel.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{state.confidence[i]=state.confidence[i]===b.dataset.confidence?null:b.dataset.confidence;save();render();el('panel').querySelector('[data-confidence="'+b.dataset.confidence+'"]').focus({preventScroll:true})});
if(el('clear'))el('clear').onclick=()=>{state.answers[i]=null;save();render()};
}
function grid(results){return '<div class="review-grid">'+questions.map((q,i)=>'<button class="review-cell '+(state.answers[i]?'answered ':'')+(state.flags[i]?'flagged':'')+'" data-go="'+i+'"><b>'+q.n+'</b><small>'+(results?(state.answers[i]===answerKey[i]?'Correct':state.answers[i]?'Review':'Unanswered'):(state.answers[i]?'Answer '+state.answers[i]:'Unanswered'))+(state.flags[i]?' · Flagged':'')+'</small></button>').join('')+'</div>'}
function bindGrid(){el('panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)))}
function renderReview(){
const unanswered=total-state.answers.filter(Boolean).length,flags=state.flags.filter(Boolean).length;
el('panel').innerHTML='<h2>Review your answers</h2><p class="review-intro">'+unanswered+' unanswered · '+flags+' marked for review. Select a question to return to it.</p>'+grid(false)+'<p class="review-note">A gold top border marks questions you flagged. You can change any answer before submitting.</p><label class="notes-label" for="notes">Any words you did not know? <span class="review-note">(optional)</span></label><textarea id="notes" placeholder="Note unfamiliar business terms or parts of the case that were unclear.">'+esc(state.notes)+'</textarea><div class="review-actions"><button id="submit" class="primary">Submit '+(unanswered?'with '+unanswered+' unanswered':'answers')+'</button><button id="return">Keep working</button></div><p class="review-note">Submission locks this attempt and shows your score. Explanations stay closed until you choose to review them.</p>';
bindGrid();el('notes').oninput=e=>{state.notes=e.target.value;save()};el('return').onclick=()=>go(state.index);
el('submit').onclick=()=>{timerUpdate();state.deadline=null;state.submitted=true;state.elapsed=limit-state.seconds;state.view='results';save();render();el('panel').scrollTop=0};
}
function summary(){return 'AP Business Practice — '+bank.title+'\nSet: '+bank.id+'\nRevision: '+bank.revision+'\nScore: '+score()+'/'+total+' ('+Math.round(score()/total*100)+'%)\nTimed minutes used: '+(state.elapsed/60).toFixed(1)+' (timer optional)\n\n'+questions.map((q,i)=>q.n+': '+(state.answers[i]||'Unanswered')+' | confidence: '+(state.confidence[i]||'not recorded')+' | flagged: '+(state.flags[i]?'yes':'no')).join('\n')+'\n\nUnfamiliar words: '+(state.notes||'none recorded')+'\n\nPlease diagnose my answers, separating terminology gaps from errors applying business concepts.'}
function renderResults(){
el('panel').innerHTML='<h2>Practice complete</h2><div class="score">'+score()+' / '+total+' <span>'+Math.round(score()/total*100)+'%</span></div><p class="result-info">This is your score for this practice set, not a predicted AP exam score. Your first-attempt answers are saved.</p><div class="review-actions"><button id="explain" class="primary">Review explanations</button><button id="copy">Copy results for tutor</button><button id="download">Download answers</button></div><p id="copy-status" class="status" role="status">Bring your answers back to our conversation for a closer diagnosis.</p><details><summary>View answer summary</summary><textarea id="result-summary" readonly>'+esc(summary())+'</textarea></details>'+grid(true)+'<button class="textbutton" id="restart">Start a new attempt</button>';
bindGrid();el('explain').onclick=()=>go(Math.max(0,state.answers.findIndex((a,i)=>a!==answerKey[i])));
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());el('copy-status').textContent='Copied. Paste the results into our conversation.'}catch(e){const d=el('result-summary');d.parentElement.open=true;d.focus();d.select();el('copy-status').textContent='Select and copy the answer summary below.'}};
el('download').onclick=()=>{const blob=new Blob([summary()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=bank.id+'-answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('restart').onclick=()=>{const box=document.createElement('div');box.className='review-actions';box.innerHTML='<p class="review-note">Starting again clears this attempt. Download your answers first if you want to keep them.</p><button id="confirm-restart" class="primary">Clear attempt and start again</button><button id="cancel-restart">Keep this attempt</button>';el('restart').replaceWith(box);el('confirm-restart').onclick=()=>{state=fresh();save();render();el('panel').scrollTop=0};el('cancel-restart').onclick=()=>renderResults();box.scrollIntoView({block:'nearest'});};
}
el('back').onclick=()=>go(state.view==='question'?Math.max(0,state.index-1):state.index);
el('next').onclick=()=>{if(state.view==='question'){if(state.index<total-1)go(state.index+1);else{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0}}else if(state.submitted){go(0)}else go(state.index)};
el('review').onclick=()=>{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0;mobileView(false)};
setInterval(timerUpdate,1000);render();
</script></body></html>
