const bank={"id":"unit1-full-20261006","title":"Unit 1 · Full practice test","revision":"eeda82674f0cc1a66bc417f43559881a788e73b74dfa6631c4bfcb131554a010","storage_id":"ap-business-unit1-full-20261006-eeda82674f0cc1a6","cases":[{"title":"Case 1 · ReadyLab","paragraphs":["ReadyLab rents reusable science kits to after-school clubs. Club coordinators choose and pay for the kits; children use them during lessons. The offer includes physical equipment, delivery, collection, and cleaning. Interviews found that coordinators spent hours sourcing supplies and often lacked storage.","Clubs pay $48 for each kit rental. Preparing, delivering, collecting, and cleaning one rental costs $30 in total variable costs. Monthly fixed costs are $900. Last month ReadyLab completed 40 paid rentals. Assume these are all revenues and costs, and ignore taxes.","The founder considered adding decorative stickers, but most interviewed coordinators asked instead for replacement equipment within one day. In a paid pilot, nine of twelve clubs rented again at the same price after their first use."]},{"title":"Case 2 · QuietForm","paragraphs":["QuietForm makes premium noise-reducing desk screens only for small recording studios. Its customers value precise fitting and independently verified sound reduction. A patented clip allows a close fit around unusual desks. Several rivals sell standard screens to a much broader market at lower prices.","QuietForm is considering a standard model. A local market survey for comparable standard screens reports: at $60, buyers would purchase 900 screens and sellers would supply 500; at $80, both quantities would be 700; at $100, buyers would purchase 500 and sellers would supply 900. Assume a competitive market with no price controls.","For the standard model, a proposed production method has total costs of $12,000 at 100 screens and $18,000 at 200 screens. Quality is unchanged. The specialized custom model would still require careful fitting work by skilled employees."]},{"title":"Case 3 · CoolRoute","paragraphs":["CoolRoute provides refrigerated bicycle deliveries for small food shops. It is comparing two cities. In Brook, new small-business borrowing rates are higher, residents increasingly prefer local fresh food, and reliable mobile networks support route-planning software. In Vale, rents are lower, but roads regularly flood during the delivery season.","Brook’s city council has announced a policy priority of supporting low-emission deliveries, but no financial assistance has been approved. A separate, enforceable food-temperature regulation requires delivery businesses to buy certified insulated containers. These containers increase CoolRoute’s startup cost.","The founder has enough funds for a small pilot, but not for major operations in both cities. Route software could reduce empty return trips. It would also increase demand for dispatchers with software skills, while reducing the need for purely manual route planning."]},{"title":"Case 4 · QueueLess","paragraphs":["Mina notices that commuters abandon a breakfast stall when the queue runs too long. She observes the stall for a week and interviews commuters about recent purchases. Many say they need a predictable collection time more than a larger menu. Mina can build simple websites and has previously coordinated school-event orders.","Her team lists possible solutions, then builds a basic page with one breakfast bundle, a collection-slot selector, and manual order confirmation. It tests the page with 30 commuters at the stall’s normal price. Eighteen place an order; only eight collect within their chosen slot because the stall cannot prepare enough orders together.","The team is considering either adding loyalty games to a full app or changing preparation and collection arrangements before another small trial. Mina would need to commit savings and working time to expansion. She hopes for profits and enjoys making everyday services easier to use."]},{"title":"Case 5 · SecondStep","paragraphs":["SecondStep repairs and sells used school bags. Its owners want a city where children can obtain durable school supplies without unnecessary waste. They believe in affordability and transparency. Their distinctive strengths are diagnosing fabric damage and completing durable repairs quickly.","The company describes its daily work as collecting used bags, repairing them, and selling them affordably through school partners. Owners may receive a share of profits, while another share funds discounted bags for low-income families. This social purpose is central to the business model.","A luxury retailer offers SecondStep a profitable contract to make decorative accessories, but it would consume most repair capacity and leave little time for affordable bags. A separate registered nonprofit, SchoolStart, charges modest fees for some workshops; all its surplus is reinvested in its educational work and none is distributed to owners.","A student who values reducing waste and is skilled at repairing fabric is considering an apprenticeship at SecondStep. A competing role offers higher pay but mainly involves selling disposable novelty items."]},{"title":"Case 6 · ClearCurrent","paragraphs":["ClearCurrent sells household water filters. Sales staff receive bonuses for the number of filters sold, with no adjustment for returns or accuracy of advice. Some staff have started describing the filters as removing a substance the product has never been tested to remove. A manager says strong sales numbers matter more than the exact wording used.","The company’s stated values include honesty and care. Correcting misleading advice and offering refunds would cost money immediately. Customers rely on the advice when deciding what to buy; employees fear losing bonuses; owners worry about profits; and a local consumer group is concerned about trust.","The board also faces a separate factory-noise decision. For this practice, assume all relevant impacts are captured by these comparable one-year estimates, measured against taking no action: limited insulation costs the business $12,000 and provides $19,000 in community benefits; full insulation costs $20,000 and provides $32,000 in community benefits. Both options meet current legal requirements, and neither changes revenue. The board has enough funds for either option."]},{"title":"Case 7 · FieldFix","paragraphs":["Nora runs FieldFix, a mobile equipment-repair business, as a sole proprietor. She makes strategic decisions, advertises, buys parts, and tracks payments herself. Her friend Dev may join as a co-owner; he is strong at scheduling and customer communication. They want to share management and protect personal assets from ordinary business debts. Assume the standard U.S. structures taught in this course and no personal guarantees or misconduct.","If FieldFix expands nationally, it may seek funding from many equity investors through a corporation. The founders understand that shareholders would elect a board that oversees executive management.","Today, growth is already causing problems. Purchase records and revenue totals need to be organized into accurate financial statements. Separately, someone must evaluate how to obtain and use money for new repair vans. New technicians also need recruitment and training, while appointment backlogs require better coordination of day-to-day repairs.","FieldFix lacks payroll specialists. A qualified external provider can process payroll at a lower total cost than a full-time specialist, although FieldFix would still need to oversee the provider’s service and protect employee information."]},{"title":"Case 8 · HarborTone","paragraphs":["HarborTone sells custom wooden instrument stands to professional musicians. Skilled craftspeople shape each stand to a customer’s instrument and inspect the finish. Buyers prioritize exact fit, appearance, and reliable delivery over the lowest price. The founders are considering a separate standard stand for large school orders.","For a custom-stand order, wood moves from a forest supplier to a mill, then to HarborTone’s workshop. Finished stands go to a distribution center and then to customers. HarborTone can buy wood from supplier A at $40 per usable set, including transport, with a 2% chance of a shipment delay, or supplier B at $34 per usable set with a 20% chance of delay. Quality is equal. A delay would cost HarborTone $100 per set in compensation and extra handling. Treat those as the only additional costs and evaluate one representative set.","Both suppliers currently use the same flood-prone port. HarborTone is considering keeping a modest reserve of wood or qualifying an alternative supplier using an independent transport route. Either action would add costs.","HarborTone also offers instrument-adjustment appointments. The service requires trained technicians, tools, a booking system, and follow-up checks. Separately, the firm could gain exclusive access to a wood treatment that customers value, preventing rivals from purchasing that treatment from its supplier."]}],"questions":[{"n":1,"stem":"Which statement correctly identifies ReadyLab’s customers and consumers?","options":["The children are customers; the clubs are consumers.","The clubs are customers; the children are consumers.","The clubs are suppliers; the children are customers.","The delivery staff are customers; the coordinators are suppliers."],"case_index":0},{"n":2,"stem":"Which description best captures the product ReadyLab sells?","options":["A service only, because equipment ownership never transfers.","A combination of a good and services that reduces preparation work.","A raw material sold to clubs for manufacturing new goods.","A good only, because the customer receives physical equipment."],"case_index":0},{"n":3,"stem":"After variable costs, how much does each rental contribute toward fixed costs and profit?","options":["$720","$48","$30","$18"],"case_index":0},{"n":4,"stem":"What was ReadyLab’s total profit or loss last month?","options":["A profit of $720.","A profit of $1,020.","A loss of $900.","A loss of $180."],"case_index":0},{"n":5,"stem":"Which next step is best supported by the evidence about problem-solution fit?","options":["Add decorative stickers before collecting further feedback.","Test a one-day replacement service with paying clubs.","Reduce the price first because clubs rejected the current price.","Expand nationally because nine renewals establish nationwide demand."],"case_index":0},{"n":6,"stem":"Which competitive strategy best describes QuietForm’s current custom-screen business?","options":["Cost leadership.","Broad differentiation.","Cost focus.","Differentiation focus."],"case_index":1},{"n":7,"stem":"At $60, what market condition and price pressure would the survey predict?","options":["A surplus of 400 screens, creating downward price pressure.","A shortage of 400 screens, creating upward price pressure.","A shortage of 400 screens, creating downward price pressure.","Equilibrium, because some buyers and sellers will trade."],"case_index":1},{"n":8,"stem":"Which proposed conclusion about the standard model is supported by the cost data?","options":["Profit doubles because the number of screens doubles.","Total cost falls by $6,000 as output doubles.","Average cost rises because total cost increases.","Average cost falls from $120 to $90 as output doubles."],"case_index":1},{"n":9,"stem":"Why could the patented clip protect QuietForm’s competitive advantage?","options":["It makes price irrelevant to every potential customer.","It protects the QuietForm brand name rather than the invention.","It can restrict rivals from using the protected invention without permission.","It prevents all rival businesses from entering the screen market."],"case_index":1},{"n":10,"stem":"What is the strongest reason to assess the standard-model expansion carefully?","options":["It could require different capabilities while weakening the firm’s specialized positioning.","Serving a broader market would automatically create monopoly power.","The lower average cost proves that broad expansion will be profitable.","Any use of machinery would make differentiation impossible."],"case_index":1},{"n":11,"stem":"Which pair of PESTEL classifications is most accurate for Brook?","options":["Higher borrowing rates: political; food preference: environmental.","Higher borrowing rates: technological; food preference: legal.","Higher borrowing rates: economic; preference for local fresh food: social.","Higher borrowing rates: social; food preference: economic."],"case_index":2},{"n":12,"stem":"Which statement best distinguishes the two government developments in Brook?","options":["Both developments are internal decisions controlled by CoolRoute.","Both developments are approved subsidies that lower startup costs.","The policy priority is political; the enforceable temperature requirement is legal.","The policy priority is legal; the temperature requirement is technological."],"case_index":2},{"n":13,"stem":"Which chain of reasoning best explains the business risk from Vale’s flooding?","options":["Flooding is an internal weakness because CoolRoute chooses the city.","Flooding raises demand for food, so delivery profit must increase.","Flooding may delay deliveries, spoil food, and reduce customer retention.","Flooding reduces rent, so delivery reliability becomes irrelevant."],"case_index":2},{"n":14,"stem":"Which entry recommendation best uses the available PESTEL evidence?","options":["Pilot in Brook, testing demand and costs while excluding unapproved aid from the budget.","Launch in both cities because favorable food preferences remove financing risk.","Choose Vale solely because its rent is lower than Brook’s.","Reject Brook because one unfavorable factor rules out a viable business."],"case_index":2},{"n":15,"stem":"What is the best-supported effect of the route software on career opportunities?","options":["Demand may shift toward dispatchers who can use digital routing tools.","The software guarantees higher wages for every existing employee.","The software changes product pricing but cannot affect job requirements.","Every delivery employee will be replaced by the software."],"case_index":2},{"n":16,"stem":"Which investigation would best deepen the team’s understanding of the customer problem?","options":["Ask commuters to describe recent abandoned purchases and observe where waiting occurs.","Ask friends whether a breakfast app sounds exciting.","Count the features in unrelated restaurant apps.","Ask only whether commuters like the name QueueLess."],"case_index":3},{"n":17,"stem":"Which sequence best describes what the team did after researching commuters?","options":["Tested a finished app before identifying any customer problem.","Selected a legal structure, issued shares, and mass-produced the product.","Defined the reliability problem, generated ideas, built a prototype, and tested it.","Guaranteed demand by asking customers whether they liked breakfast."],"case_index":3},{"n":18,"stem":"What does the trial most strongly support?","options":["The team should stop testing because a prototype must include every planned feature.","The low on-time collection rate proves nobody values predictable collection.","Some commuters will pay, but the current process does not reliably deliver the promised benefit.","Eighteen purchases prove the product is ready for citywide expansion."],"case_index":3},{"n":19,"stem":"Which next test most directly responds to the findings?","options":["Adjust preparation capacity and time-slot limits, then measure on-time collection in another paid trial.","Add loyalty games and measure how long users spend in the app.","Launch at more stalls and treat registration totals as proof of reliable service.","Lower prices and count visits without checking collection reliability."],"case_index":3},{"n":20,"stem":"Which assessment of Mina’s expansion decision is most accurate?","options":["She risks time and savings despite initial demand, motivated by potential profit and problem-solving.","Enjoying problem-solving means she cannot be a profit-seeking entrepreneur.","Her website skills eliminate the financial risk of expansion.","The only resource at risk is cash because working time has no alternative use."],"case_index":3},{"n":21,"stem":"Which pairing correctly separates a core value from a core competency?","options":["Affordability is a core competency; repair expertise is a core value.","Owners receiving profits is a technical skill; school partnerships are an ethical rule.","The citywide aspiration is a repair technique; the sales channel is a belief.","Transparency is a core value; rapid durable repair is a core competency."],"case_index":4},{"n":22,"stem":"Which proposed statement most clearly expresses SecondStep’s mission?","options":["We collect, repair, and sell affordable school bags through school partnerships.","Affordability and transparency should guide every employee’s decisions.","Repair at least 200 bags during the next calendar month.","A city where every child has durable supplies and less material is wasted."],"case_index":4},{"n":23,"stem":"Which classification best fits SecondStep?","options":["A social enterprise that uses commercial activity to pursue a central social purpose.","A government agency because its customers include school communities.","A nonprofit solely because it provides discounts to some families.","A business without a social objective because owners receive some profit."],"case_index":4},{"n":24,"stem":"Why can SchoolStart’s workshop fees be consistent with its nonprofit purpose?","options":["Workshop customers become shareholders whenever they pay a fee.","Charging a fee automatically makes an organization a conventional for-profit business.","Revenue can support its mission as long as surplus is reinvested rather than distributed to owners.","A nonprofit must spend exactly its revenue in every month."],"case_index":4},{"n":25,"stem":"Which recommendation best applies values and competencies to both decisions?","options":["Accept the highest-paying options because values matter only after choosing a job or contract.","Assess the contract’s effect on affordable repairs, and weigh the apprenticeship’s fit with the student’s skills and values.","Reject every profitable contract and paid apprenticeship to demonstrate commitment to social goals.","Choose by values alone because capacity, skills, and income cannot affect long-term viability."],"case_index":4},{"n":26,"stem":"Which feature of ClearCurrent’s management most directly encourages the misleading sales claims?","options":["The board has enough funds to purchase factory insulation.","The company has employees who work directly with customers.","Bonuses reward sales volume while managers dismiss the accuracy of the advice.","Customers care about filter performance when choosing products."],"case_index":5},{"n":27,"stem":"Which response best addresses the causes of the sales problem?","options":["Add an honesty statement but retain the same rewards and management signals.","Move the claims into verbal conversations so written complaints are less likely.","Offer larger volume bonuses to fund possible refunds later.","Correct customer information, train staff, and align bonuses and manager reviews with accurate advice."],"case_index":5},{"n":28,"stem":"Which comparison correctly identifies stakeholders in the sales decision?","options":["Only the owners are stakeholders because only they receive profit.","Employees are internal stakeholders; customers and the consumer group are external stakeholders.","Employees are external stakeholders because bonuses are paid in money.","Customers are internal stakeholders because they use the filters at home."],"case_index":5},{"n":29,"stem":"Using the greatest total net benefit criterion and the stated assumptions, which noise option should the board choose?","options":["Full insulation: its net benefit is $32,000, compared with $19,000 for limited insulation.","Full insulation: its net benefit is $12,000, compared with $7,000 for limited insulation.","No insulation: community benefits are excluded because residents are not owners.","Limited insulation: its lower business cost necessarily creates the higher total net benefit."],"case_index":5},{"n":30,"stem":"Which statement best evaluates the tradeoff in correcting the sales claims?","options":["Refunds must increase immediate profit because ethical actions always save money.","Refunds can reduce immediate profit while protecting customers and helping rebuild trust.","Only the effect on this month’s bonuses matters because the other effects cannot occur yet.","Compliance with any relevant law would settle every question about honesty."],"case_index":5},{"n":31,"stem":"Which description best captures Nora’s role as a sole proprietor?","options":["She has primary responsibility for the business and performs several different functions.","She is an employee of shareholders who appoint her board.","She automatically avoids personal liability by keeping business records.","She handles only operations because sole proprietors cannot make marketing decisions."],"case_index":6},{"n":32,"stem":"Which structure most directly fits Nora and Dev’s stated current priorities?","options":["A nonprofit simply because equipment repair benefits customers.","A member-managed LLC.","Nora’s existing sole proprietorship with Dev as a second sole owner.","A general partnership without limited-liability protection."],"case_index":6},{"n":33,"stem":"What tradeoff accompanies the contemplated corporate expansion?","options":["A board eliminates the need for managers and specialized departments.","Incorporation means the founders must personally pay every corporate debt.","Issuing shares increases funding without giving investors any ownership interest.","Access to more equity funding can come with shared control and board oversight."],"case_index":6},{"n":34,"stem":"Which assignment of responsibilities best addresses the two financial tasks?","options":["Finance prepares the statements; human resources negotiates all van financing.","Marketing prepares financial statements; accounting recruits technicians.","Accounting prepares the statements; finance evaluates funding and investment in vans.","Operations raises all equity funding; research and development records revenue."],"case_index":6},{"n":35,"stem":"Which staffing plan best matches the described problems?","options":["Use HR for recruitment and training, operations for repair scheduling, and the specialist provider for payroll.","Use accounting to redesign every repair process and treat outsourcing as transferring all responsibility.","Have the board handle all daily appointments because specialization adds no expertise.","Use marketing for technician training and eliminate oversight of the payroll provider."],"case_index":6},{"n":36,"stem":"Which production choice best fits HarborTone’s current competitive strategy?","options":["Retain artisan production because mass production can never produce high-quality goods.","Replace all custom work with identical stands because mass production guarantees higher value.","Choose whichever process uses the fewest employees without considering customer priorities.","Retain skilled custom production for professional orders; assess mass production for standardized school orders."],"case_index":7},{"n":37,"stem":"Which interpretation of the described supply chain is correct?","options":["The distribution center converts raw wood into the finished stands.","Transport is outside the supply chain because it does not change the product’s shape.","The forest supplier is downstream from the customer because it sells an input.","A disruption at the mill could delay workshop production and later customer delivery."],"case_index":7},{"n":38,"stem":"Under the stated assumptions, which supplier has the lower expected cost per set?","options":["Supplier B at $34, because only the quoted purchase price is a business cost.","Supplier A at $140, compared with supplier B at $134.","Supplier A at $42, compared with supplier B at $54.","Supplier B at $36, compared with supplier A at $60."],"case_index":7},{"n":39,"stem":"Which proposal best addresses the shared port risk?","options":["Split orders equally between A and B while keeping the same port for both.","Remove all reserve inventory because stock cannot affect resilience.","Order from the cheaper supplier and assume a low price prevents flooding.","Qualify a supplier with an independent route and compare its extra cost with the value of fewer disruptions."],"case_index":7},{"n":40,"stem":"Which statement correctly links HarborTone’s service and exclusivity decisions to supply chains?","options":["Booking and follow-up are unrelated to service delivery because they occur outside the appointment.","The service needs coordinated people and delivery systems; exclusive treatment access could make imitation harder.","A service has no supply chain because the technician does not sell a physical stand.","Exclusive treatment access is solely a price reduction and cannot affect rivals."],"case_index":7}],"key":["B","B","D","D","B","D","B","D","C","A","C","C","C","A","A","A","C","C","A","A","D","A","A","C","B","C","D","B","B","B","A","B","D","C","A","D","D","C","D","B"],"explanations":["The clubs purchase the rentals, while the children use the equipment. The customer and consumer can be different.","The offer combines tangible equipment with delivery, collection, and cleaning. Together they solve the clubs’ preparation and storage problems.","$48 − $30 = $18 per rental remains to cover fixed costs and then contribute to profit.","Revenue = 40 × $48 = $1,920. Total cost = (40 × $30) + $900 = $2,100. Profit = −$180. A positive per-rental contribution does not prove overall profitability.","A replacement-service test directly addresses the reliability need coordinators identified. Repeat paid use supports local fit, while a further test checks whether the new service adds enough value to justify its cost.","QuietForm combines a narrow target segment with valued specialized features. That is differentiation focus.","Quantity demanded is 900 and quantity supplied is 500: a 400-screen shortage. With no price controls, the imbalance creates upward pressure on price.","$12,000 ÷ 100 = $120 per screen; $18,000 ÷ 200 = $90. This illustrates economies of scale even though total cost increases.","Patent protection can make a valued feature harder for competitors to copy. It is a barrier affecting that invention, not a guarantee against all competition.","The existing advantage depends on custom fitting and a narrow segment. A standard model could reach more buyers, but the firm should test demand and operational fit before diverting resources from its established advantage.","Borrowing rates affect financing costs, an economic mechanism. The preference for local fresh food is a lifestyle or taste trend, a social factor.","A government priority is a political signal; an enforceable requirement is a legal constraint. Related categories can overlap, but CoolRoute must not treat unapproved support as actual funding.","An environmental disruption can prevent timely deliveries. Spoilage and unreliability can raise costs and drive customers away, harming viability.","Brook offers demand and technology opportunities but also financing and compliance costs. A limited pilot matches available resources and can test the combined effect; pending political support is not dependable revenue.","Technology can create demand for particular skills while reducing demand for older tasks. The case supports a change in skill mix, not universal job loss or wage growth.","Specific past behavior and direct observation provide evidence about the problem and its setting. They are more useful here than broad approval of an app idea.","The case follows the main design-thinking activities from problem definition through ideation, prototyping, and testing. Later findings can send the team back to an earlier activity.","Paid orders provide initial evidence of willingness to buy. The collection failures show that the current solution does not yet provide reliable timing, so the team should improve and retest that core promise.","The bottleneck is preparation capacity. Changing that process and measuring the promised outcome is a focused iteration on the evidence.","Mina commits both financial and human resources without a guarantee of sufficient revenue. Her existing skills help her pursue the opportunity, while profit and satisfaction both motivate her.","Values concern guiding beliefs; competencies concern what the business does especially well. Transparency guides conduct, while repair expertise helps the business deliver distinctive value.","A mission explains the business’s work and approach. Collecting, repairing, and selling through schools describes what SecondStep does to pursue its broader vision.","SecondStep sells products, may distribute profit to owners, and places a social objective at the center of its model. Those features fit a social enterprise.","A nonprofit can charge for services and generate a surplus. The case states that SchoolStart uses all surplus for its educational work instead of owners’ private profit.","The contract could crowd out SecondStep’s mission-aligned work. The apprenticeship fits the student’s repair skills and waste-reduction values, but income and development opportunities still deserve consideration.","Volume-only rewards and a manager’s tolerance of inaccurate claims can make unethical selling attractive to staff. Both incentives and leadership behavior shape culture.","A coherent response repairs customer harm and changes the systems supporting misleading claims: training, incentives, accountability, and leadership behavior.","Employees work within the business. Customers and the consumer group are outside it but have an interest in the effects of its decisions.","Limited insulation: $19,000 − $12,000 = $7,000. Full insulation: $32,000 − $20,000 = $12,000. Full insulation has the greater total net benefit under the supplied assumptions.","Correcting the claims is consistent with honesty and care, but has immediate costs. It may help restore relationships and future trust; it does not guarantee an immediate profit increase.","A sole proprietor often performs leadership, marketing, financial, and operational roles. Nora’s broad responsibilities illustrate this pattern.","A member-managed LLC can combine shared owner management with limited personal liability for ordinary business debts, under the assumptions stated in the case.","A corporation can raise equity from many investors, but the founders must share ownership and decision-making authority. The board oversees executives who run the company.","Accounting tracks earnings and expenditures and prepares statements. Finance uses financial information to secure and manage funds for decisions such as acquiring vans.","Recruiting and training fit HR; organizing repairs fits operations. Payroll outsourcing can address a skill gap and lower cost, while service quality and information handling still require management attention.","Skilled custom work supports the professional segment’s priorities. A standardized school product may suit a higher-volume process, but that choice should be evaluated separately.","The stages are connected: the workshop needs the mill’s output, and delivery depends on workshop completion. A delay can therefore propagate through the chain.","A: $40 + (0.02 × $100) = $42. B: $34 + (0.20 × $100) = $54. The lower quoted price is not the lower expected cost once delay risk is included.","Two suppliers can share the same vulnerability. An independent route diversifies that specific risk; the firm should still weigh extra cost and service requirements. Reserve stock is another possible buffer, not a free solution.","Service supply chains coordinate the resources needed to deliver a service and support customers. Exclusive access to a valued input can also act as a barrier for rivals, although it does not guarantee success."]};
const questions=bank.questions, answerKey=bank.key, explanations=bank.explanations;
const total=questions.length;
const qaMode=new URLSearchParams(location.search).get('qa')==='1';
const STORE=bank.storage_id+(qaMode?'-qa':'');
if(qaMode){const badge=document.createElement('span');badge.className='qa-label';badge.textContent='QA attempt';document.querySelector('header').append(badge);}
const fresh=()=>({answers:Array(total).fill(null),flags:Array(total).fill(false),confidence:Array(total).fill(null),eliminated:questions.map(q=>q.options.map(()=>false)),index:0,view:'question',submitted:false,notes:''});
let state=fresh(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&Array.isArray(saved.answers)&&saved.answers.length===total&&saved.answers.every(a=>a===null||'ABCD'.includes(a))&&Array.isArray(saved.flags)&&saved.flags.length===total&&Array.isArray(saved.confidence)&&saved.confidence.length===total&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<total&&['question','review','results'].includes(saved.view))state={...fresh(),answers:saved.answers,flags:saved.flags,confidence:saved.confidence,eliminated:saved.eliminated,index:saved.index,view:saved.view,submitted:!!saved.submitted,tracking:saved.tracking,notes:typeof saved.notes==='string'?saved.notes:''}}catch(e){storageOK=false}
// Older attempts have no elimination field; preserve their answers and timing.
if(!Array.isArray(state.eliminated)||state.eliminated.length!==total||!state.eliminated.every((row,i)=>Array.isArray(row)&&row.length===questions[i].options.length&&row.every(value=>typeof value==='boolean')))state.eliminated=questions.map(q=>q.options.map(()=>false));
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){storageOK=false}}
let displayedCase=-1;
function showCase(index){const c=bank.cases[index];if(displayedCase===index)return;displayedCase=index;el('case-title').textContent=c.title;el('case-body').innerHTML=c.paragraphs.map(p=>'<p class="case-paragraph">'+esc(p)+'</p>').join('');document.querySelector('.passage').scrollTop=0;}
showCase(questions[state.index].case_index);
function mobileView(showCaseStudy){document.body.classList.toggle('show-poem',showCaseStudy);el('case-tab').setAttribute('aria-selected',showCaseStudy);el('question-tab').setAttribute('aria-selected',!showCaseStudy)}
el('case-tab').onclick=()=>mobileView(true);el('question-tab').onclick=()=>mobileView(false);
function go(n){state.index=n;state.view='question';save();render();el('panel').scrollTop=0;mobileView(false)}
function score(){return state.answers.reduce((total,a,i)=>total+(a===answerKey[i]?1:0),0)}
function nav(){el('progress').textContent=state.answers.filter(Boolean).length+' of '+total+' answered';el('back').disabled=state.view==='question'&&state.index===0;el('back').textContent=state.view==='question'?'Back':'Questions';el('next').textContent=state.view==='question'?(state.index===total-1?(state.submitted?'Results':'Review answers'):'Next'):(state.submitted?'Review explanations':'Return to question');el('review').textContent=state.submitted?'Results':'Review answers';}
function render(){
PracticeAttempts.sync();
nav();showCase(questions[state.index].case_index);const panel=el('panel');
if(state.view==='review'){renderReview();return}if(state.view==='results'){renderResults();return}
const q=questions[state.index],a=state.answers[state.index],i=state.index;
panel.innerHTML='<div class="q-head"><h2 id="question-title">Question '+q.n+' of '+total+'</h2><label class="flag-label"><input id="flag" type="checkbox" '+(state.flags[i]?'checked':'')+'>Mark for review</label></div><p class="stem" id="stem">'+esc(q.stem)+'</p><div class="options" role="radiogroup" aria-labelledby="stem">'+q.options.map((text,k)=>{const l=String.fromCharCode(65+k);return '<div class="option-row"><button class="option '+(state.eliminated[i][k]?'eliminated':'')+'" role="radio" aria-checked="'+(a===l)+'" data-choice="'+l+'" '+(state.submitted?'disabled':'')+'><span class="letter">'+l+'</span><span class="option-text">'+esc(text)+'</span></button>'+(!state.submitted?'<button class="strike" type="button" data-eliminate="'+l+'" aria-pressed="'+state.eliminated[i][k]+'" aria-label="'+(state.eliminated[i][k]?'Restore':'Cross out')+' answer '+l+'" title="'+(state.eliminated[i][k]?'Restore':'Cross out')+' answer '+l+'">'+(state.eliminated[i][k]?'↶':'×')+'</button>':'')+'</div>'}).join('')+'</div>'+(!state.submitted?'<p class="helper">Use × to cross out an option. Tap ↶ to restore it.</p>':'')+
(!state.submitted?'<div class="confidence"><p>Confidence (optional)</p><div class="segments">'+['Low','Medium','High'].map(c=>'<button data-confidence="'+c+'" aria-pressed="'+(state.confidence[i]===c)+'">'+c+'</button>').join('')+'</div></div><div class="utility"><span>'+(!storageOK?'Browser storage unavailable; keep this page open.':'Progress saved in this browser')+'</span><button class="textbutton" id="clear">Clear answer</button></div>':'<div class="feedback"><strong class="'+(a===answerKey[i]?'correct':'incorrect')+'">'+(a===answerKey[i]?'Correct':a?'Your answer: '+a:'Unanswered')+' · Answer: '+answerKey[i]+'</strong>'+esc(explanations[i])+'</div>');
el('flag').onchange=e=>{state.flags[i]=e.target.checked;save()};
panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=b.dataset.choice;state.eliminated[i][b.dataset.choice.charCodeAt(0)-65]=false;save();render();el('panel').querySelector('[data-choice="'+state.answers[i]+'"]').focus({preventScroll:true})});
panel.querySelectorAll('[data-eliminate]').forEach(b=>b.onclick=()=>{const letter=b.dataset.eliminate,k=letter.charCodeAt(0)-65;state.eliminated[i][k]=!state.eliminated[i][k];if(state.eliminated[i][k]&&state.answers[i]===letter)state.answers[i]=null;save();render();el('panel').querySelector('[data-eliminate="'+letter+'"]').focus({preventScroll:true})});
panel.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{state.confidence[i]=state.confidence[i]===b.dataset.confidence?null:b.dataset.confidence;save();render();el('panel').querySelector('[data-confidence="'+b.dataset.confidence+'"]').focus({preventScroll:true})});
if(el('clear'))el('clear').onclick=()=>{state.answers[i]=null;save();render()};
}
function grid(results){return '<div class="review-grid">'+questions.map((q,i)=>'<button class="review-cell '+(state.answers[i]?'answered ':'')+(state.flags[i]?'flagged':'')+'" data-go="'+i+'"><b>'+q.n+'</b><small>'+(results?(state.answers[i]===answerKey[i]?'Correct':state.answers[i]?'Review':'Unanswered'):(state.answers[i]?'Answer '+state.answers[i]:'Unanswered'))+(state.flags[i]?' · Flagged':'')+'</small></button>').join('')+'</div>'}
function bindGrid(){el('panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)))}
function renderReview(){
const unanswered=total-state.answers.filter(Boolean).length,flags=state.flags.filter(Boolean).length;
el('panel').innerHTML='<h2>Review your answers</h2><p class="review-intro">'+unanswered+' unanswered · '+flags+' marked for review. Select a question to return to it.</p>'+grid(false)+'<p class="review-note">A gold top border marks questions you flagged. You can change any answer before submitting.</p><label class="notes-label" for="notes">Any words you did not know? <span class="review-note">(optional)</span></label><textarea id="notes" placeholder="Note unfamiliar business terms or parts of the case that were unclear.">'+esc(state.notes)+'</textarea><div class="review-actions"><button id="submit" class="primary">Submit '+(unanswered?'with '+unanswered+' unanswered':'answers')+'</button><button id="return">Keep working</button></div><p class="review-note">Submission locks this attempt and shows your score. Explanations stay closed until you choose to review them.</p>';
bindGrid();el('notes').oninput=e=>{state.notes=e.target.value;save()};el('return').onclick=()=>go(state.index);
el('submit').onclick=()=>{PracticeAttempts.finish(state);state.submitted=true;state.view='results';save();render();el('panel').scrollTop=0};
}
function summary(){return 'AP Business Practice — '+bank.title+'\nSet: '+bank.id+'\nRevision: '+bank.revision+'\nScore: '+score()+'/'+total+' ('+Math.round(score()/total*100)+'%)\n\n'+questions.map((q,i)=>q.n+': '+(state.answers[i]||'Unanswered')+' | confidence: '+(state.confidence[i]||'not recorded')+' | flagged: '+(state.flags[i]?'yes':'no')).join('\n')+'\n\nTopics:\n'+topicScores().map(t=>t.name+': '+t.correct+'/'+t.total).join('\n')+'\n\nUnfamiliar words: '+(state.notes||'none recorded')+'\n\nPlease diagnose my answers, separating terminology gaps from errors applying business concepts.'}
const topicNames=["1.1 \u00b7 Business and value", "1.2 \u00b7 Markets and advantage", "1.3 \u00b7 PESTEL", "1.4 \u00b7 Business ideas", "1.5 \u00b7 Vision", "1.6 \u00b7 Ethics", "1.7 \u00b7 Organization and roles", "1.8 \u00b7 Supply chains"];
function topicScores(){return topicNames.map((name,k)=>({name,correct:questions.reduce((n,q,i)=>n+(q.case_index===k&&state.answers[i]===answerKey[i]?1:0),0),total:questions.filter(q=>q.case_index===k).length}));}
function topicTable(){return '<table class="topic-scores"><caption>Topic breakdown</caption><thead><tr><th scope="col">Topic</th><th scope="col">Correct</th></tr></thead><tbody>'+topicScores().map(t=>'<tr><th scope="row">'+esc(t.name)+'</th><td>'+t.correct+' / '+t.total+'</td></tr>').join('')+'</tbody></table>';}
function renderResults(){
el('panel').innerHTML='<h2>Practice complete</h2><div class="score">'+score()+' / '+total+' <span>'+Math.round(score()/total*100)+'%</span></div><p class="result-info">This is your score for this practice set, not a predicted AP exam score. Your first-attempt answers are saved.</p><div class="review-actions"><button id="explain" class="primary">Review explanations</button><button id="copy">Copy results for tutor</button><button id="download">Download answers</button></div><p id="copy-status" class="status" role="status">Bring your answers back to our conversation for a closer diagnosis.</p><details><summary>View answer summary</summary><textarea id="result-summary" readonly>'+esc(summary())+'</textarea></details>'+topicTable()+grid(true)+'<button class="textbutton" id="restart">Start a new attempt</button>';
bindGrid();el('explain').onclick=()=>go(Math.max(0,state.answers.findIndex((a,i)=>a!==answerKey[i])));
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());el('copy-status').textContent='Copied. Paste the results into our conversation.'}catch(e){const d=el('result-summary');d.parentElement.open=true;d.focus();d.select();el('copy-status').textContent='Select and copy the answer summary below.'}};
el('download').onclick=()=>{const blob=new Blob([summary()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=bank.id+'-answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('restart').onclick=()=>{const box=document.createElement('div');box.className='review-actions';box.innerHTML='<p class="review-note">Starting again clears this attempt. Download your answers first if you want to keep them.</p><button id="confirm-restart" class="primary">Clear attempt and start again</button><button id="cancel-restart">Keep this attempt</button>';el('restart').replaceWith(box);el('confirm-restart').onclick=()=>{state=fresh();save();render();el('panel').scrollTop=0};el('cancel-restart').onclick=()=>renderResults();box.scrollIntoView({block:'nearest'});};
}
el('back').onclick=()=>go(state.view==='question'?Math.max(0,state.index-1):state.index);
el('next').onclick=()=>{if(state.view==='question'){if(state.index<total-1)go(state.index+1);else{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0}}else if(state.submitted){go(0)}else go(state.index)};
el('review').onclick=()=>{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0;mobileView(false)};
render();

PracticeAttempts.attach({
  getState:()=>state, save:save,
  snapshot:()=>({
    quizPath:decodeURIComponent(location.pathname).split("/").slice(-2).join("/"),
    quizId:bank.id || STORE, title:bank.title || document.title,
    subject:"AP Business",
    tracking:state.tracking, score:score(), maximum:bank.questions.length,
    bonus:0, bonusMaximum:0,
    answers:state.answers.map((answer,i)=>({id:bank.questions[i].kind==="bonus" ? "bonus:"+state.bonusOrder[bank.questions[i].bonusOrdinal] : "core:"+bank.questions[i].n,number:i+1,answer,topic:bank.questions[i].topic || null,correct:answer===bank.key[i]}))
  })
});
</script></body></html>
