<script>
const bank={"id":"business-diagnostic-2026-10-26","title":"AP Business Diagnostic","revision":"22fbafd9461ef0574bd1ee30da129f765bfa9736162c0c18f15d5a1cb2a647ce","storage_id":"ap-business-business-diagnostic-2026-10-26-22fbafd9461ef057","cases":[{"title":"Case 1 · FoldRight Laundry","paragraphs":["[1] FoldRight picks up, washes, folds, and returns laundry for students living in dorms at Lakeview University. Most orders are paid for by parents through a monthly plan; the students are the ones who hand over their bags.","[2] A monthly plan costs $60 and includes 8 bags. FoldRight's variable cost is $5 per bag (detergent, labor, and delivery). Fixed costs (van lease and rent) are $3,000 per month. Last month FoldRight had 70 subscribers, and every subscriber used all 8 bags.","[3] Students say the service saves them about 3 hours a week. A pricing survey found that the typical family would pay up to $90 a month for the plan.","[4] Before expanding, founder Priya surveyed 200 students with one question: \"Wouldn't a fast, affordable laundry service that frees up your weekend be useful?\" 172 said yes. Follow-up interviews with 15 students who cancelled after one month found that most quit because the fixed pickup times clashed with their class schedules.","[5] Priya's team drafted two statements. Statement X: \"A campus where no student has to choose between clean clothes and study time.\" Statement Y: \"We pick up, clean, and return laundry for Lakeview students so they can spend their time on what matters.\"","[6] Priya lists what makes FoldRight special: a folding technique that halves folding time, and a routing app the team built that no rival has. She adds that the team \"believes in treating every garment as if it were our own.\"","[7] The team built a prototype: self-service lockers in the student union where students can drop laundry any time. In a two-week test, students used the lockers heavily if they lived in the dorm next to the union, but almost never if they lived across campus."]},{"title":"Case 2 · The E-Bike Market","paragraphs":["[1] Voltway builds one basic commuter e-bike in a large automated factory. As yearly output grew from 5,000 to 40,000 bikes, its cost per bike fell from $900 to $620. Voltway sells nationwide at the lowest price of any national brand.","[2] Ridgeback Cargo sells e-cargo bikes designed specifically for parents who carry two young children. Its patented child-seat system is hard for rivals to copy, and its bikes cost about 40% more than a typical e-bike.","[3] PedalPlain sells only to college students in three cities. It offers the cheapest stripped-down e-bike available in those cities and keeps costs low by selling only online with no showrooms."]},{"title":"Case 3 · Voltway's Changing Environment","paragraphs":["[1] Voltway (from Case 2) competes mainly on low price. Its managers list five recent developments.","[2] (a) The state legislature passes a law requiring every e-bike battery to pass a new fire-safety certification, which will add about $40 to the cost of each bike.","[3] (b) Gasoline prices rise sharply while household incomes stay flat.","[4] (c) More young professionals now prefer to live in city centers without owning a car.","[5] (d) A new battery chemistry doubles riding range, but using it would require Voltway to buy expensive new factory equipment.","[6] (e) Summers in Voltway's biggest markets now bring many more extreme-heat days, when few people want to ride outdoors."]},{"title":"Case 4 · Oakline Woodworks","paragraphs":["[1] Dana and Marcus run Oakline Woodworks as a general partnership with no written partnership agreement. Each owns half the business, and both take orders and sign contracts.","[2] Without telling Dana, Marcus signed a $60,000 lumber contract. The business cannot pay, and Marcus has no personal savings. Dana argues that she owes at most $30,000 because she owns only half the business.","[3] After the dispute, they consider reorganizing. Option 1: a limited liability company (LLC) in which they are members who manage the business themselves. Option 2: a corporation that can issue shares to outside investors and must have a board of directors.","[4] Their current goals: protect their homes and savings from business debts, keep running day-to-day operations themselves, and avoid selling ownership to outsiders for now. Within five years, however, they may want to raise $500,000 by selling ownership stakes to many investors."]},{"title":"Case 5 · Brisk Beverages Inc.","paragraphs":["[1] Brisk Beverages is a corporation. Its founder, Leo, originally owned all 1,000 of its shares.","[2] Event 1: Leo personally sells 250 of his existing shares to his cousin for $50,000.","[3] Event 2: Later, Brisk issues 500 new shares to an investment fund for $200,000. The money goes into the company's bank account to build a bottling line. Brisk's managers had also considered a $200,000 bank loan at 8% annual interest instead.","[4] Brisk's shareholders elect a board of directors, and the board hired CEO Amara. Sales have now fallen for two years in a row, and many shareholders are unhappy with Amara's performance.","[5] Two tasks are on this month's list: (1) choose whether the bottling line should be funded by the loan or the share issue, and (2) record each payment to the equipment maker in Brisk's financial statements."]},{"title":"Case 6 · Glowleaf Skincare","paragraphs":["[1] A lab test shows that one batch of 50,000 Glowleaf sunscreen bottles provides SPF 22 protection instead of the SPF 30 printed on the label. The difference is unlikely to be detected by regulators.","[2] Managers estimate the effects of selling the batch as labeled. Benefits: $400,000 to internal stakeholders (sales revenue kept) and $200,000 to external stakeholders (retailer sales and product availability). Costs: $100,000 to internal stakeholders (expected refunds) and $900,000 to external stakeholders (customers' sunburn and health risks).","[3] Glowleaf's sales staff earn a bonus for every bottle sold, whether or not the bottle is later returned.","[4] Glowleaf's mission statement reads: \"We keep families safe in the sun with products they can trust.\" The company also has a written code of conduct and runs yearly ethics training."]},{"title":"Case 7 · Harvest Box Meal Kits","paragraphs":["[1] Harvest Box ships 2,000 meal kits every week. Each kit contains a spice pack bought from an outside supplier.","[2] Supplier A charges $1.00 per spice pack but is often late; late packs force Harvest Box to issue refunds averaging $300 per week. Supplier B charges $1.25 per pack and is always on time, so it would eliminate those refunds. Sales volume would not change either way.","[3] Harvest Box assembles its kits on an automated packing line that turns out thousands of identical boxes a day. Its sister brand, Cast \u0026 Copper, employs four skilled smiths who hand-forge about 200 cast-iron pans a month for cooks who will pay a premium for handmade cookware.","[4] After each delivery, Harvest Box asks customers to rate every recipe, uses the ratings to revise recipes, and accepts returns of damaged boxes.","[5] Harvest Box signed a deal with an organic farm: the farm will sell its heirloom tomatoes only to Harvest Box and to no other meal-kit company.","[6] Harvest Box is also considering hiring an outside courier company to handle all home deliveries, which its own drivers do now."]},{"title":"Case 8 · Pulse Fitness (Unit 2.1)","paragraphs":["[1] Pulse Fitness, a gym chain, collects data from every new member: age, ZIP code, income range, and answers to a survey about lifestyle and attitudes toward fitness.","[2] Pulse's marketing team divides its market four ways: (i) people living within 3 miles of a gym; (ii) college students aged 18–24; (iii) people who value wellness and enjoy social, group workouts; (iv) members who visit 4+ times a week versus members who have stopped coming.","[3] Pulse spends about $120 in advertising and promotions to sign up each new member. The average member pays $40 a month and stays for 18 months. (Ignore other costs.)","[4] Last month, hackers got into Pulse's member database. Weeks later, several members found credit cards had been opened in their names.","[5] Pulse's marketing manager, a lifelong runner, wrote the member survey so that nearly every question was about running. She concluded that most members want more treadmills."]}],"questions":[{"n":1,"stem":"In FoldRight's business, who is the customer and who is the user?","options":["Students are the customers because they hand over the bags; parents are users.","Lakeview University is the customer because the service operates on its campus.","Parents are the customers; students are the users.","Parents are both the customers and the users because they pay for the plan."],"case_index":0},{"n":2,"stem":"Using paragraph 2, what was FoldRight's profit or loss last month?","options":["A profit of $1,400","A loss of $1,600","A profit of $1,200","A loss of $3,000"],"case_index":0},{"n":3,"stem":"For one monthly plan, which statement correctly splits the value FoldRight creates (ignore fixed costs)?","options":["Customers keep $30 of value and FoldRight captures $20.","Customers keep $90 of value and FoldRight captures $60.","Customers keep $50 of value and FoldRight captures $20.","Customers keep $30 of value and FoldRight captures $60."],"case_index":0},{"n":4,"stem":"What is the most serious weakness of Priya's survey?","options":["Its leading wording invites \"yes\" and assumes which problem matters.","A sample of 200 is too small to say anything about a university's students.","It shows strong demand, so the only remaining question is the right price.","It should have surveyed parents only, since they are the ones who pay."],"case_index":0},{"n":5,"stem":"Which next step should Priya take before expanding?","options":["Expand to three more campuses because 86% of students said yes.","Ask open-ended questions about pickup timing, then test a fix with a few students.","Lower the price to $45 so more students stay subscribed.","Repeat the same survey with 1,000 students to confirm the result."],"case_index":0},{"n":6,"stem":"Using design thinking, what should FoldRight do after the locker test in paragraph 7?","options":["Launch the lockers campus-wide, since testing is the final stage.","Revise the prototype (e.g., lockers near every dorm) and retest.","Drop the locker idea completely, since most students did not use it.","Restart at the empathize stage and set the test results aside."],"case_index":0},{"n":7,"stem":"How should Statements X and Y be classified?","options":["X is a mission, and Y is a vision.","Both are missions because both mention students.","X is a vision, and Y is a core value.","X is a vision, and Y is a mission."],"case_index":0},{"n":8,"stem":"In paragraph 6, which items are core competencies and which is a core value?","options":["The garment belief is a core competency; the technique and app are core values.","Technique and app are core competencies; the garment belief is a core value.","All three are core competencies because they all make FoldRight special.","All three are core values because the team chose them."],"case_index":0},{"n":9,"stem":"Which competitive strategy does Voltway follow?","options":["Cost focus","Differentiation","Differentiation focus","Cost leadership"],"case_index":1},{"n":10,"stem":"Which strategy does Ridgeback Cargo follow, and why?","options":["Differentiation focus: a unique premium product for one narrow segment.","Differentiation: its unique patented seats let it charge more than rivals.","Cost focus: it serves one narrow segment of parents.","Cost leadership: its patent prevents rivals from undercutting its price."],"case_index":1},{"n":11,"stem":"Which strategy does PedalPlain follow?","options":["Cost leadership","Cost focus","Differentiation focus","Differentiation"],"case_index":1},{"n":12,"stem":"Why would a new startup find it hard to match Voltway's prices?","options":["Voltway's large output lowers its cost per bike below a small producer's.","Voltway holds a patent on its basic commuter e-bike.","Government rules allow only national brands to sell e-bikes.","Voltway's customers are loyal because its bikes have unique features."],"case_index":1},{"n":13,"stem":"Which statement correctly classifies development (a) and its likely effect on Voltway?","options":["Legal factor: higher cost per bike forces a price rise or a smaller margin.","Economic factor: it lowers demand because household incomes fall.","Technological factor: it gives Voltway better batteries and longer range.","Social factor: it changes buyers' attitudes, so demand for e-bikes rises."],"case_index":2},{"n":14,"stem":"Which is the best analysis of development (b) for Voltway?","options":["Environmental factor: rising gas prices mean more pollution, so cities restrict cars.","Economic factor: higher gas prices raise Voltway's production costs, lowering all e-bike demand.","Economic factor: pricier gas makes e-bikes a better substitute, and flat incomes favor cheap models.","Social factor: people now dislike driving, so demand rises for premium e-bikes."],"case_index":2},{"n":15,"stem":"Which development is a social factor, and what is its most likely effect?","options":["(c); it lowers demand because city residents walk everywhere.","(d); customers now expect longer-range batteries.","(e); people's attitudes toward heat change how they ride.","(c); it raises demand for city commuter e-bikes like Voltway's."],"case_index":2},{"n":16,"stem":"Which is the best evaluation of development (d) for Voltway?","options":["Technological: it is guaranteed to raise profit because customers want longer range.","Legal: Voltway will be required to use the new battery chemistry.","Technological: better bikes, but new equipment costs could erode its price edge.","Environmental: it doubles range and so reduces pollution."],"case_index":2},{"n":17,"stem":"How does development (e) most likely affect Voltway?","options":["Social: young people now prefer indoor activities, raising demand for indoor bikes.","Environmental: hot weather raises Voltway's factory costs by $40 per bike.","Environmental: fewer good riding days reduce e-bike use and demand.","Political: governments will ban riding on hot days."],"case_index":2},{"n":18,"stem":"Is Dana right that she owes at most $30,000?","options":["No; she can be personally liable for the full $60,000.","Yes; her liability is limited to her 50% share of the debt.","No; she owes nothing, because only Marcus signed the contract.","Yes; creditors can collect only from the business's assets."],"case_index":3},{"n":19,"stem":"Which structure best fits Dana and Marcus's current goals?","options":["A corporation, because only corporations protect owners' personal assets.","A general partnership with a written agreement, because it limits their liability.","An LLC, because it limits liability and lets members manage it.","A sole proprietorship, because it is the cheapest structure."],"case_index":3},{"n":20,"stem":"If they later want to raise $500,000 by selling ownership stakes to many investors, which structure fits best?","options":["An LLC, because it can issue stock just like a corporation.","A corporation, because it can issue shares of stock.","A general partnership, by taking a $500,000 bank loan.","A sole proprietorship, because one owner can raise money faster."],"case_index":3},{"n":21,"stem":"Suppose Oakline becomes an LLC and Dana invests $25,000. Later the LLC fails owing $140,000. Assuming normal LLC protection and no personal guarantees, what can Dana lose?","options":["$70,000, because she is responsible for half the debt.","Her $25,000 investment, but not her personal assets to cover the rest of the debt.","Nothing; her $25,000 is returned before creditors are paid.","The full $140,000, because she is a member of the LLC."],"case_index":3},{"n":22,"stem":"Right after Event 1, who receives the $50,000, how many shares exist, and what percent does Leo own?","options":["Brisk receives it; 1,250 shares exist; Leo owns 80%.","Leo receives it; 1,250 shares exist; Leo owns 60%.","Brisk receives it; 1,000 shares exist; Leo owns 75%.","Leo receives it; 1,000 shares exist; Leo owns 75%."],"case_index":4},{"n":23,"stem":"After Event 2 (following Event 1), what percent of Brisk does Leo own?","options":["75%","37.5%","66.7%","50%"],"case_index":4},{"n":24,"stem":"Compared with the bank loan, what is the main trade-off of the share issue?","options":["It must be repaid with 8% interest, but owners keep all their ownership.","No repayment or interest, but existing owners are diluted.","It dilutes ownership and also must be repaid with interest.","It has the same effect on ownership and costs as the loan."],"case_index":4},{"n":25,"stem":"What is the most appropriate way for unhappy shareholders to respond to Amara's performance?","options":["Fire Amara directly, since shareholders manage daily operations.","Ask Amara to replace the board, since the CEO oversees the board.","Ask the board to take over daily production scheduling from Amara.","Press the board they elect, which oversees and can replace the CEO."],"case_index":4},{"n":26,"stem":"Which departments should handle tasks (1) and (2)?","options":["Finance handles (1); accounting handles (2).","Accounting handles (1); finance handles (2).","Operations handles (1); accounting handles (2).","Finance handles (1); human resources handles (2)."],"case_index":4},{"n":27,"stem":"What is the net benefit of selling the batch, counting only internal stakeholders and then all stakeholders?","options":["+$300,000 internal only; +$600,000 for all stakeholders.","−$400,000 internal only; −$400,000 for all stakeholders.","+$300,000 internal only; −$400,000 for all stakeholders.","+$400,000 internal only; −$500,000 for all stakeholders."],"case_index":5},{"n":28,"stem":"Which group lists only external stakeholders?","options":["Customers, retailers, and the local community","Employees, customers, and retailers","Owners, the board of directors, and managers","Sales staff, suppliers, and customers"],"case_index":5},{"n":29,"stem":"How does the sales bonus in paragraph 3 relate to the decision, and what change would best address it?","options":["Incentives only encourage ethical behavior, so the bonus needs no change.","It has no link to ethics; raising it would boost sales and morale.","It rewards pushing the batch no matter what; tie bonuses to sales net of returns and complaints.","It is a negative incentive; Glowleaf should replace it with a code of conduct."],"case_index":5},{"n":30,"stem":"Using the second common approach to ethical dilemmas—aligning with the mission—what should Glowleaf do?","options":["Sell the batch, because regulators are unlikely to detect the difference.","Sell the batch, because internal stakeholders gain $300,000.","Let the sales staff decide, because they earn the bonus.","Not sell it as labeled, since that breaks the promise of safety and trust."],"case_index":5},{"n":31,"stem":"Based only on paragraph 2, what happens to weekly profit if Harvest Box switches to Supplier B, and when would B become the better choice?","options":["Profit rises by $300, because B eliminates the refunds.","Profit falls by $200; B becomes better once it adds exactly $200 of extra weekly benefit.","Profit falls by $200; B wins only if it adds more than $200 of extra weekly benefit.","Profit falls by $500, because B costs more per pack."],"case_index":6},{"n":32,"stem":"Which statement best describes the two production processes in paragraph 3?","options":["Both use mass production, since both sell to customers nationwide.","Cast \u0026 Copper uses mass production; Harvest Box uses artisan production.","Cast \u0026 Copper should switch to mass production, since artisan costs are always too high.","Cast \u0026 Copper is artisan (buyers pay for handmade); Harvest Box is mass production."],"case_index":6},{"n":33,"stem":"Which supply chain stage does paragraph 4 describe?","options":["Utilization","Retail sales","Distribution","Sourcing"],"case_index":6},{"n":34,"stem":"How does the farm deal in paragraph 5 create competitive advantage?","options":["It is outsourcing, which lowers Harvest Box's costs.","It is an exclusive supply deal that blocks rivals' access to the tomatoes.","It creates economies of scale by increasing Harvest Box's output.","It is a patent that legally protects Harvest Box's recipes."],"case_index":6},{"n":35,"stem":"Which is the best pairing of a benefit and a risk of outsourcing deliveries?","options":["Benefit: Harvest Box gains full control of delivery. Risk: it must hire more drivers.","Benefit: outsourcing guarantees faster delivery. Risk: none, since contracts prevent problems.","Benefit: a specialist may deliver more cheaply. Risk: less control over quality.","Benefit: it creates an exclusive supply agreement. Risk: higher ingredient prices."],"case_index":6},{"n":36,"stem":"Which correctly classifies segments (i)–(iv)?","options":["(i) geographic, (ii) demographic, (iii) behavioral, (iv) psychographic","(i) geographic, (ii) demographic, (iii) psychographic, (iv) behavioral","(i) demographic, (ii) geographic, (iii) psychographic, (iv) behavioral","(i) geographic, (ii) psychographic, (iii) demographic, (iv) behavioral"],"case_index":7},{"n":37,"stem":"What is the difference between Pulse's demographic data and a customer profile?","options":["They are the same thing: both list members' ages and incomes.","A customer profile lists members' ZIP codes; demographic data describes their attitudes.","Demographic data covers only existing members; a customer profile covers only competitors' customers.","Demographic data are traits like age; a profile is a fuller picture of the likely buyer."],"case_index":7},{"n":38,"stem":"Using paragraph 3, is Pulse's spending to attract members worthwhile?","options":["Yes; lifetime value of $720 is far above the $120 acquisition cost.","No; the $120 acquisition cost is greater than the $40 a member pays.","Yes; lifetime value is $120 and acquisition cost is $40.","No; lifetime value is $58, which is below $120."],"case_index":7},{"n":39,"stem":"In paragraph 4, which event is the data breach and which is identity theft?","options":["Opening the credit cards is the data breach; the hacking is identity theft.","Both events are identity theft, since members' data was stolen.","The hacking is the data breach; the opened credit cards are identity theft.","Both events are data breaches, since both involve member data."],"case_index":7},{"n":40,"stem":"What best describes the problem with the marketing manager's survey?","options":["Target customers: she correctly focused on Pulse's most important customers.","Brand loyalty: members who run are the most loyal to Pulse.","Referral: runners refer other runners, so the survey is accurate.","Bias: her own preference for running skewed the questions and results."],"case_index":7}],"key":["C","B","A","A","B","B","D","B","D","A","B","A","A","C","D","C","C","A","C","B","B","D","D","B","D","A","C","A","C","D","C","D","A","B","C","B","D","A","C","D"],"explanations":["The customer is the one who buys; the user consumes the product. Parents pay through the plan, while students use the service.","Revenue = 70 × $60 = $4,200. Variable cost = 70 × 8 × $5 = $2,800. Profit = $4,200 − $2,800 − $3,000 = −$1,600.","Value to the customer is $90; the plan's variable cost is 8 × $5 = $40. Total value created = $90 − $40 = $50. The customer keeps $90 − $60 = $30; FoldRight captures $60 − $40 = $20.","\"Wouldn't a fast, affordable… useful?\" bundles positive features and invites agreement. The interviews show the real problem is pickup timing, which the survey assumed away.","Neutral, open-ended research targets the problem the interviews revealed (timing), and a small test checks the fix before spending on expansion.","Testing showed the idea works when the lockers are close by. Design thinking is iterative: use the test feedback to return to ideating/prototyping and retest.","X describes a desired future (\"a campus where…\"). Y states what FoldRight does now, for whom, and why.","Core competencies are capabilities that let a business outperform rivals. Core values are principles and beliefs that guide behavior.","Voltway targets the broad national market and wins on lowest price, made possible by efficient, large-scale production.","Two dimensions matter: source of advantage (unique patented seats, premium price = differentiation) and scope (only parents carrying two children = focus).","PedalPlain targets a narrow segment (college students in three cities) and competes on the lowest price within it.","Economies of scale: cost per bike fell from $900 to $620 as output rose to 40,000. A startup making few bikes would face costs closer to the higher figure.","A new law sets a required certification, which is a legal change. The added $40 cost either squeezes margin or pushes price up, weakening a low-price strategy.","Higher gas prices raise the cost of driving, increasing demand for substitutes like e-bikes. With flat incomes, price-sensitive buyers favor the low-price brand—Voltway.","A shift in lifestyle preferences (car-free city living) is social. People without cars need other ways to get around, increasing demand for commuter e-bikes.","A new battery chemistry is technological. It creates an opportunity (longer range) but at a cost—expensive equipment—which matters most for a business competing on lowest price.","More extreme-heat days is a climate/environmental change. Fewer days people want to ride reduces the usefulness of an e-bike and so demand.","In a general partnership, each partner is personally liable for the partnership's obligations—including those another partner signed. Owning half the business does not cap her liability at half.","An LLC protects members' personal assets and can be member-managed. They do not currently want to sell ownership, so they do not need stock.","Corporations raise equity by issuing stock to many investors. LLC owners are members; an LLC cannot issue stock.","Limited liability caps a member's loss at what they put into the business; creditors cannot collect the remaining debt from her home or savings.","Leo sold his own existing shares, so he gets the money and the total does not change: Leo 750 + cousin 250 = 1,000. 750/1,000 = 75%.","New issuance adds shares: 1,000 + 500 = 1,500 total. Leo still holds 750, so 750/1,500 = 50%. The $200,000 goes to the company.","Equity financing brings in money in exchange for ownership (dilution), with no loan to repay. The loan keeps ownership unchanged but requires repayment plus 8% interest ($16,000 a year).","Shareholders own the company and elect the board. The board oversees management and strategy and holds the CEO accountable; the CEO runs day-to-day operations and reports to the board.","Finance decides how to raise and use money (loan vs. shares). Accounting records transactions and prepares financial statements.","Internal: $400,000 − $100,000 = +$300,000. All: ($400,000 + $200,000) − ($100,000 + $900,000) = $600,000 − $1,000,000 = −$400,000. Selling looks good only if outsiders are ignored.","External stakeholders are outside the organization but affected by it—customers, retailers, suppliers, lenders, and the community.","Incentives can encourage unethical as well as ethical behavior. A per-bottle bonus that ignores returns rewards selling the mislabeled batch; linking pay to net sales removes that pressure.","The mission promises safety and trust. Selling SPF 22 labeled SPF 30 directly contradicts both, whatever the short-term revenue.","Extra cost = 2,000 × $0.25 = $500 a week. Avoided refunds = $300. Net = −$200. At exactly $200 of extra benefit the options tie; B improves profit only above $200.","Artisan processes use skilled craftspeople, little mechanization, and limited quantities—viable when customers value handmade quality. Mass production makes large standardized volumes at low per-unit cost.","Utilization is the stage where businesses collect customer feedback to improve products, provide support, and accept returns.","Restrictive or exclusive agreements with suppliers limit competitors' access to an input, which builds a barrier that protects the business's advantage.","Outsourcing hands a task to an outside specialist who may be more efficient, but the business loses direct control over quality—here, how customers receive their kits.","Geographic = where people live; demographic = measurable traits like age or occupation; psychographic = values, lifestyle, attitudes; behavioral = what customers do (usage frequency, loyalty, lapses).","A customer profile describes a typical target buyer (who they are, what they value, how they behave). Demographic data—age, income—is only one ingredient.","Customer lifetime value = $40 × 18 = $720. Customer acquisition cost = $120. Value exceeds cost by $600 per member (ignoring other costs).","A data breach is unauthorized access to data. Identity theft is the fraudulent use of someone's personal information—which can follow a breach.","Bias is a personal preference that distorts research. Asking nearly only about running guarantees running-related answers."]};
const questions=bank.questions, answerKey=bank.key, explanations=bank.explanations;
const total=questions.length;
const qaMode=new URLSearchParams(location.search).get('qa')==='1';
const STORE=bank.storage_id+(qaMode?'-qa':'');
if(qaMode){const badge=document.createElement('span');badge.className='qa-label';badge.textContent='QA attempt';document.querySelector('header').append(badge);}
const fresh=()=>({answers:Array(total).fill(null),flags:Array(total).fill(false),confidence:Array(total).fill(null),eliminated:questions.map(q=>q.options.map(()=>false)),index:0,view:'question',submitted:false,notes:''});
let state=fresh(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&Array.isArray(saved.answers)&&saved.answers.length===total&&saved.answers.every(a=>a===null||'ABCD'.includes(a))&&Array.isArray(saved.flags)&&saved.flags.length===total&&Array.isArray(saved.confidence)&&saved.confidence.length===total&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<total&&['question','review','results'].includes(saved.view))state={...fresh(),answers:saved.answers,flags:saved.flags,confidence:saved.confidence,eliminated:saved.eliminated,index:saved.index,view:saved.view,submitted:!!saved.submitted,tracking:saved.tracking,notes:typeof saved.notes==='string'?saved.notes:''}}catch(e){storageOK=false}
if(!Array.isArray(state.eliminated)||state.eliminated.length!==total||!state.eliminated.every((row,i)=>Array.isArray(row)&&row.length===questions[i].options.length&&row.every(value=>typeof value==='boolean')))state.eliminated=questions.map(q=>q.options.map(()=>false));
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){storageOK=false}}
let displayedCase=-1;
function showCase(index){const c=bank.cases[index];if(displayedCase===index)return;displayedCase=index;el('case-title').textContent=c.title;el('case-body').innerHTML=c.paragraphs.map(p=>'<p class="case-paragraph">'+esc(p)+'</p>').join('');document.querySelector('.passage').scrollTop=0;}
showCase(questions[state.index].case_index);
function mobileView(showCaseStudy){document.body.classList.toggle('show-poem',showCaseStudy);el('case-tab').setAttribute('aria-selected',showCaseStudy);el('question-tab').setAttribute('aria-selected',!showCaseStudy)}
el('case-tab').onclick=()=>mobileView(true);el('question-tab').onclick=()=>mobileView(false);
function go(n){state.index=n;state.view='question';save();render();el('panel').scrollTop=0;mobileView(false)}
function score(){return state.answers.reduce((total,a,i)=>total+(a===answerKey[i]?1:0),0)}
function nav(){el('progress').textContent=state.answers.filter(Boolean).length+' of '+total+' answered';el('back').disabled=state.view==='question'&&state.index===0;el('back').textContent=state.view==='question'?'Back':'Questions';el('next').textContent=state.view==='question'?(state.index===total-1?(state.submitted?'Results':'Review answers'):'Next'):(state.submitted?'Review explanations':'Return to question');el('review').textContent=state.submitted?'Results':'Review answers';}
function render(){
PracticeAttempts.sync();
nav();showCase(questions[state.index].case_index);const panel=el('panel');
if(state.view==='review'){renderReview();return}if(state.view==='results'){renderResults();return}
const q=questions[state.index],a=state.answers[state.index],i=state.index;
panel.innerHTML='<div class="q-head"><h2 id="question-title">Question '+q.n+' of '+total+'</h2><label class="flag-label"><input id="flag" type="checkbox" '+(state.flags[i]?'checked':'')+'>Mark for review</label></div><p class="stem" id="stem">'+esc(q.stem)+'</p><div class="options" role="radiogroup" aria-labelledby="stem">'+q.options.map((text,k)=>{const l=String.fromCharCode(65+k);return '<div class="option-row"><button class="option '+(state.eliminated[i][k]?'eliminated':'')+'" role="radio" aria-checked="'+(a===l)+'" data-choice="'+l+'" '+(state.submitted?'disabled':'')+'><span class="letter">'+l+'</span><span class="option-text">'+esc(text)+'</span></button>'+(!state.submitted?'<button class="strike" type="button" data-eliminate="'+l+'" aria-pressed="'+state.eliminated[i][k]+'" aria-label="'+(state.eliminated[i][k]?'Restore':'Cross out')+' answer '+l+'" title="'+(state.eliminated[i][k]?'Restore':'Cross out')+' answer '+l+'">'+(state.eliminated[i][k]?'↶':'×')+'</button>':'')+'</div>'}).join('')+'</div>'+(!state.submitted?'<p class="helper">Use × to cross out an option. Tap ↶ to restore it.</p>':'')+
(!state.submitted?'<div class="confidence"><p>Confidence (optional)</p><div class="segments">'+['Low','Medium','High'].map(c=>'<button data-confidence="'+c+'" aria-pressed="'+(state.confidence[i]===c)+'">'+c+'</button>').join('')+'</div></div><div class="utility"><span>'+(!storageOK?'Browser storage unavailable; keep this page open.':'Progress saved in this browser')+'</span><button class="textbutton" id="clear">Clear answer</button></div>':'<div class="feedback"><strong class="'+(a===answerKey[i]?'correct':'incorrect')+'">'+(a===answerKey[i]?'Correct':a?'Your answer: '+a:'Unanswered')+' · Answer: '+answerKey[i]+'</strong>'+esc(explanations[i])+'</div>');
el('flag').onchange=e=>{state.flags[i]=e.target.checked;save()};
panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=b.dataset.choice;state.eliminated[i][b.dataset.choice.charCodeAt(0)-65]=false;save();render();el('panel').querySelector('[data-choice="'+state.answers[i]+'"]').focus({preventScroll:true})});
panel.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{state.confidence[i]=state.confidence[i]===b.dataset.confidence?null:b.dataset.confidence;save();render();el('panel').querySelector('[data-confidence="'+b.dataset.confidence+'"]').focus({preventScroll:true})});
if(el('clear'))el('clear').onclick=()=>{state.answers[i]=null;save();render()};
}
function grid(results){return '<div class="review-grid">'+questions.map((q,i)=>'<button class="review-cell '+(state.answers[i]?'answered ':'')+(state.flags[i]?'flagged':'')+'" data-go="'+i+'"><b>'+q.n+'</b><small>'+(results?(state.answers[i]===answerKey[i]?'Correct':state.answers[i]?'Review':'Unanswered'):(state.answers[i]?'Answer '+state.answers[i]:'Unanswered'))+(state.flags[i]?' · Flagged':'')+'</small></button>').join('')+'</div>'}
function bindGrid(){el('panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)))}
function renderReview(){
const unanswered=total-state.answers.filter(Boolean).length,flags=state.flags.filter(Boolean).length;
el('panel').innerHTML='<h2>Review your answers</h2><p class="review-intro">'+unanswered+' unanswered · '+flags+' marked for review. Select a question to return to it.</p>'+grid(false)+'<p class="review-note">A gold top border marks questions you flagged. You can change any answer before submitting.</p><label class="notes-label" for="notes">Any words you did not know? <span class="review-note">(optional)</span></label><textarea id="notes" placeholder="Note unfamiliar business terms or parts of the case that were unclear.">'+esc(state.notes)+'</textarea><div class="review-actions"><button id="submit" class="primary">Submit '+(unanswered?'with '+unanswered+' unanswered':'answers')+'</button><button id="return">Keep working</button></div><p class="review-note">Submission locks this attempt and shows your score. Explanations stay closed until you choose to review them.</p>';
bindGrid();el('notes').oninput=e=>{state.notes=e.target.value;save()};el('return').onclick=()=>go(state.index);
el('submit').onclick=()=>{PracticeAttempts.finish(state);state.submitted=true;state.view='results';save();render();el('panel').scrollTop=0};
}
function summary(){return 'AP Business Practice — '+bank.title+'\nSet: '+bank.id+'\nRevision: '+bank.revision+'\nScore: '+score()+'/'+total+' ('+Math.round(score()/total*100)+'%)\n\n'+questions.map((q,i)=>q.n+': '+(state.answers[i]||'Unanswered')+' | confidence: '+(state.confidence[i]||'not recorded')+' | flagged: '+(state.flags[i]?'yes':'no')).join('\n')+'\n\nTopics:\n'+topicScores().map(t=>t.name+': '+t.correct+'/'+t.total).join('\n')+'\n\nUnfamiliar words: '+(state.notes||'none recorded')+'\n\nPlease diagnose my answers, separating terminology gaps from errors applying business concepts.'}
const topicNames=["1.1 · Business and value", "1.2 · Markets and advantage", "1.3 · PESTEL", "1.4 · Business ideas", "1.5 · Vision and values", "1.6 · Ethics", "1.7 · Organization and ownership", "1.8 · Supply chains", "2.1 · Customers and marketing"];const questionTopic=[0, 0, 0, 3, 3, 3, 4, 4, 1, 1, 1, 1, 2, 2, 2, 2, 2, 6, 6, 6, 6, 6, 6, 6, 6, 6, 5, 5, 5, 5, 7, 7, 7, 7, 7, 8, 8, 8, 8, 8];
function topicScores(){return topicNames.map((name,k)=>({name,correct:questions.reduce((n,q,i)=>n+(questionTopic[i]===k&&state.answers[i]===answerKey[i]?1:0),0),total:questionTopic.filter(t=>t===k).length}));}
function topicTable(){return '<table class="topic-scores"><caption>Topic breakdown</caption><thead><tr><th scope="col">Topic</th><th scope="col">Correct</th></tr></thead><tbody>'+topicScores().map(t=>'<tr><th scope="row">'+esc(t.name)+'</th><td>'+t.correct+' / '+t.total+'</td></tr>').join('')+'</tbody></table>';}
function renderResults(){
el('panel').innerHTML='<h2>Practice complete</h2><div class="score">'+score()+' / '+total+' <span>'+Math.round(score()/total*100)+'%</span></div><p class="result-info">This is your score for this practice set, not a predicted AP exam score. Your first-attempt answers are saved.</p><div class="review-actions"><button id="explain" class="primary">Review explanations</button><button id="copy">Copy results for tutor</button><button id="download">Download answers</button></div><p id="copy-status" class="status" role="status">Bring your answers back to our conversation for a closer diagnosis.</p><details><summary>View answer summary</summary><textarea id="result-summary" readonly>'+esc(summary())+'</textarea></details>'+topicTable()+grid(true)+'<button class="textbutton" id="restart">Start a new attempt</button>';
bindGrid();el('explain').onclick=()=>go(Math.max(0,state.answers.findIndex((a,i)=>a!==answerKey[i])));
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());el('copy-status').textContent='Copied. Paste the results into our conversation.'}catch(e){const d=el('result-summary');d.parentElement.open=true;d.focus();d.select();el('copy-status').textContent='Select and copy the answer summary below.'}};
el('download').onclick=()=>{const blob=new Blob([summary()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=bank.id+'-answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('restart').onclick=()=>{const box=document.createElement('div');box.className='review-actions';box.innerHTML='<p class="review-note">Starting again clears this attempt. Download your answers first if you want to keep them.</p><button id="confirm-restart" class="primary">Clear attempt and start again</button><button id="cancel-restart">Keep this attempt</button>';el('restart').replaceWith(box);el('confirm-restart').onclick=()=>{state=fresh();save();render();el('panel').scrollTop=0};el('cancel-restart').onclick=()=>renderResults();box.scrollIntoView({block:'nearest'});};
}
el('back').onclick=()=>go(state.view==='question'?Math.max(0,state.index-1):state.index);
el('next').onclick=()=>{if(state.view==='question'){if(state.index<total-1)go(state.index+1);else{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0}}else if(state.submitted){go(0)}else go(state.index)};
el('review').onclick=()=>{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0;mobileView(false)};
render();
PracticeAttempts.attach({
  getState:()=>state, save:save,
  snapshot:()=>({
    quizPath:decodeURIComponent(location.pathname).split("/").slice(-2).join("/"),
    quizId:bank.id || STORE, title:bank.title || document.title,
    subject:"AP Business",
    tracking:state.tracking, score:score(), maximum:bank.questions.length,
    bonus:0, bonusMaximum:0,
    answers:state.answers.map((answer,i)=>({id:"core:"+bank.questions[i].n,number:i+1,answer,topic:topicNames[questionTopic[i]],correct:answer===bank.key[i]}))
  })
});
</script></body></html>
