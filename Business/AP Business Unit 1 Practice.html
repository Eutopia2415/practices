<script>
const bank={"id":"ap-business-unit1-cases-01","title":"Unit 1 · Businesses, Competition, and New Ideas","revision":"bf25ef48a09a6468a8d94fb6c8ff302e373ab3593975ad77232059cd4f38a318","minutes":40,"storage_id":"ap-lit-ap-business-unit1-cases-01-bf25ef48a09a6468","lines":[{"text":"Case 1 · LunchLink | Questions 1–3","stanzaStart":false},{"text":"LunchLink sells prepared lunches to parents whose children attend an after-school program. Parents order and pay; their children eat the meals. Interviews reveal that parents struggle to find meals delivered before the program starts that also accommodate their children’s dietary restrictions.","stanzaStart":false},{"text":"LunchLink offers clearly labeled meals with delivery before 3 p.m. Several nearby restaurants sell less expensive lunches but cannot meet both requirements. In a four-week paid trial, 42 of 50 families reorder at the regular price.","stanzaStart":false},{"text":"For one meal, a parent’s maximum willingness to pay is $14. LunchLink charges $10. The full cost of making and delivering that meal, including its allocated share of operating expenses, is $7.","stanzaStart":false},{"text":"Case 2 · TrailForm | Questions 4–6","stanzaStart":true},{"text":"TrailForm makes hiking boots exclusively for hikers whose feet require unusually wide toe boxes. Its trained fitters offer custom adjustments and a repair service. Customers pay more than they would for ordinary hiking boots because mass-market brands rarely meet these fitting needs.","stanzaStart":false},{"text":"TrailForm’s fitters learn through a lengthy apprenticeship. The company has also secured an exclusive five-year supply agreement for a durable, flexible material from the only producer currently able to make it. Other materials remain available to competing bootmakers.","stanzaStart":false},{"text":"A manager proposes replacing the custom fittings with standard sizes and lowering prices for everyone. However, TrailForm’s small workshop would still have higher costs per pair than large mass-market producers.","stanzaStart":false},{"text":"Case 3 · FreshLoop | Questions 7–9","stanzaStart":true},{"text":"FreshLoop rents reusable food containers to office cafeterias and washes returned containers in a central facility. It is evaluating a second city. Local employers report that employees increasingly prefer reusable containers, and six cafeterias have expressed interest but have not signed contracts.","stanzaStart":false},{"text":"New sorting equipment available from several suppliers could cut the labor time needed for each returned container. At the same time, lenders have raised interest rates, increasing the cost of a loan to equip the new facility.","stanzaStart":false},{"text":"The proposed facility draws heavily on the city’s reservoir. Repeated droughts have reduced the reservoir’s usable water supply. FreshLoop has not yet estimated the cost of water-saving equipment or alternative water sources.","stanzaStart":false},{"text":"Case 4 · QueueLess | Questions 10–12","stanzaStart":true},{"text":"While waiting at her school cafeteria, Maya notices students leaving without food because the lunch period is short. She interviews students and cafeteria staff. The interviews reveal that unpredictable pickup times, rather than a lack of menu choices, cause most frustration.","stanzaStart":false},{"text":"Maya frames the problem as helping students collect a meal within a predictable time window. Her team sketches several approaches, then draws paper screens for an ordering system. The drawings show how a student would select a pickup time, but cannot process an order.","stanzaStart":false},{"text":"The team next runs a basic working website for 30 students. It accepts real orders for one meal option, assigns pickup slots, and sends orders to cafeteria staff. It has no loyalty points or profile customization. Students complete purchases, but several report that the pickup instructions are confusing.","stanzaStart":false},{"text":"Case 5 · SecondStart | Questions 13–15","stanzaStart":true},{"text":"SecondStart repairs and sells refurbished laptops. Its founders make affordable technology access for low-income learners its primary purpose. It earns profits, reinvests much of them in discounted laptops and paid trainee positions, and distributes some profit to its owners.","stanzaStart":false},{"text":"Its statements include: “A future in which every learner can participate digitally” and “We refurbish reliable laptops and sell them affordably through community learning centers.” The founders also state that honesty about a device’s condition must guide every sale.","stanzaStart":false},{"text":"The repair team can diagnose faults and restore older laptops faster and more reliably than nearby competitors. Managers coach new employees to disclose battery limitations even when disclosure might lose a sale, and they recognize staff who do so.","stanzaStart":false},{"text":"Case 6 · CedarWorks | Questions 16–18","stanzaStart":true},{"text":"CedarWorks manufactures cabinets near a residential neighborhood. Its current production meets the applicable local rules, but residents report that dust from the workshop prevents them from comfortably using their gardens. Leaders value both affordability for customers and care for the surrounding community.","stanzaStart":false},{"text":"Engineers estimate two optional dust-control systems. Over the same period, System A would cost $18,000 and provide $30,000 in total benefits to affected stakeholders. System B would cost $29,000 and provide $46,000 in total benefits. For this comparison, these figures include all relevant costs and benefits, use the same baseline, and exclude double counting.","stanzaStart":false},{"text":"Inside the workshop, supervisors award bonuses based only on the number of cabinets shipped. Some workers conceal minor defects to meet those targets. An existing employee handbook already instructs staff to report defects, but supervisors sometimes praise high output even when reported problems remain unresolved.","stanzaStart":false},{"text":"Case 7 · LiftCare | Questions 19–21","stanzaStart":true},{"text":"Elena and Marcus operate LiftCare as a general partnership that maintains lifts in small warehouses. Elena has extensive technical experience; Marcus handles scheduling, billing, and routine payments. They hire an independent accounting firm each year to prepare the partnership’s tax return.","stanzaStart":false},{"text":"A distribution company invites LiftCare to bid on a multi-year maintenance contract. The contract could increase sales substantially, but LiftCare would have to buy tools and hire staff before receiving its first payment. Neither partner has experience forecasting the funding needs of a project this size.","stanzaStart":false},{"text":"Elena wants to evaluate the opportunity before bidding. Marcus proposes using last year’s completed tax return as the only financial analysis, arguing that a larger sales contract must improve the partnership’s financial position.","stanzaStart":false},{"text":"Case 8 · ClayRoute | Questions 22–24","stanzaStart":true},{"text":"ClayRoute’s skilled potters make small batches of hand-shaped mugs with custom glazes for independent cafés. Buyers pay a premium for the distinctive finish and personal design consultations. Production is slow, and training a new potter takes considerable time.","stanzaStart":false},{"text":"The company is choosing between two clay suppliers. Supplier A charges $4 per kilogram, is nearby, consistently meets ClayRoute’s quality specifications, and delivers within two days. Supplier B charges $3 per kilogram, usually takes six weeks to deliver, and has had inconsistent quality. Café orders often change with little notice. ClayRoute’s owners want to preserve the current premium offer.","stanzaStart":false},{"text":"ClayRoute also runs pottery workshops. Before each workshop it obtains clay, tools, and a qualified instructor. After each workshop, staff ask participants for feedback and adjust the next session’s instructions. The workshops are sold as a service, separately from the mugs.","stanzaStart":false}],"cases":[{"title":"Case 1 · LunchLink | Questions 1–3","paragraphs":["LunchLink sells prepared lunches to parents whose children attend an after-school program. Parents order and pay; their children eat the meals. Interviews reveal that parents struggle to find meals delivered before the program starts that also accommodate their children’s dietary restrictions.","LunchLink offers clearly labeled meals with delivery before 3 p.m. Several nearby restaurants sell less expensive lunches but cannot meet both requirements. In a four-week paid trial, 42 of 50 families reorder at the regular price.","For one meal, a parent’s maximum willingness to pay is $14. LunchLink charges $10. The full cost of making and delivering that meal, including its allocated share of operating expenses, is $7."]},{"title":"Case 2 · TrailForm | Questions 4–6","paragraphs":["TrailForm makes hiking boots exclusively for hikers whose feet require unusually wide toe boxes. Its trained fitters offer custom adjustments and a repair service. Customers pay more than they would for ordinary hiking boots because mass-market brands rarely meet these fitting needs.","TrailForm’s fitters learn through a lengthy apprenticeship. The company has also secured an exclusive five-year supply agreement for a durable, flexible material from the only producer currently able to make it. Other materials remain available to competing bootmakers.","A manager proposes replacing the custom fittings with standard sizes and lowering prices for everyone. However, TrailForm’s small workshop would still have higher costs per pair than large mass-market producers."]},{"title":"Case 3 · FreshLoop | Questions 7–9","paragraphs":["FreshLoop rents reusable food containers to office cafeterias and washes returned containers in a central facility would have to buy tools and hire staff before receiving its first payment. Neither partner has experience forecasting the funding needs of a project this size.","Elena wants to evaluate the opportunity before bidding. Marcus proposes using last year’s completed tax return as the only financial analysis, arguing that a larger sales contract must improve the partnership’s financial position."]},{"title":"Case 8 · ClayRoute | Questions 22–24","paragraphs":["ClayRoute’s skilled potters make small batches of hand-shaped mugs with custom glazes for independent cafés. Buyers pay a premium for the distinctive finish and personal design consultations. Production is slow, and training a new potter takes considerable time.","The company is choosing between two clay suppliers. Supplier A charges $4 per kilogram, is nearby, consistently meets ClayRoute’s quality specifications, and delivers within two days. Supplier B charges $3 per kilogram, usually takes six weeks to deliver, and has had inconsistent quality. Café orders often change with little notice. ClayRoute’s owners want to preserve the current premium offer.","ClayRoute also runs pottery workshops. Before each workshop it obtains clay, tools, and a qualified instructor. After each workshop, staff ask participants for feedback and adjust the next session’s instructions. The workshops are sold as a service, separately from the mugs."]}],"questions":[{"n":1,"stem":"For the purchases described in Case 1, which statement correctly distinguishes LunchLink’s customers from its consumers?","options":["The children are the customers because they use the meals; the parents are the consumers because they pay.","The parents are both customers and consumers because paying determines both roles.","The parents are the customers because they buy the meals; the children are the consumers because they eat them.","The children are both customers and consumers because the meals are designed for them."],"case_index":0},{"n":2,"stem":"Which evidence most strongly supports the conclusion that LunchLink has achieved problem-solution fit for the families in its trial?","options":["Its competitors charge less for meals that are already available nearby.","Its service addresses both identified needs, and most trial families buy again at the regular price.","Its delivery deadline requires the business to organize an afternoon route.","Its owners chose a product that is frequently purchased by families."],"case_index":0},{"n":3,"stem":"For the single meal described in Case 1, how much value does LunchLink capture as profit, and how much consumer surplus does the buyer retain?","options":["$7 in profit and $3 in consumer surplus","$3 in profit and $4 in consumer surplus","$3 in profit and $7 in consumer surplus","$10 in profit and $4 in consumer surplus"],"case_index":0},{"n":4,"stem":"Which competitive strategy is TrailForm currently pursuing?","options":["Broad differentiation, because the company charges more than competing bootmakers.","Differentiation focus, because specialized features serve a narrowly defined group of hikers.","Cost leadership, because repairs lower customers’ replacement expenses across the entire footwear market.","Cost focus, because custom adjustments reduce the need for customers to buy several pairs."],"case_index":1},{"n":5,"stem":"Which statement best explains how the exclusive material agreement could help protect TrailForm’s competitive advantage?","options":["It restricts rivals’ access to an input that contributes to TrailForm’s product performance.","It reduces TrailForm’s costs to the level of the largest mass-market producers.","It makes TrailForm the only business allowed to sell any kind of hiking boot.","It guarantees that buyers will continue paying a premium after the agreement expires."],"case_index":1},{"n":6,"stem":"What is the strongest reason to question the manager’s proposed change?","options":["TrailForm could lose its distinctive benefit while still lacking the costs needed to compete on low prices.","Standard sizes would necessarily create a new scarce resource controlled by TrailForm.","Lower prices would necessarily prevent TrailForm from attracting any new customers.","A wider target market would require TrailForm to remain a custom-fitting specialist."],"case_index":1},{"n":7,"stem":"Which pair of developments in Case 3 most directly represents social and technological factors, respectively?","options":["Growing preference for reusable containers and the availability of faster sorting equipment","Expressions of interest from cafeterias and the cost of borrowing money","Declining reservoir levels and growing preference for reusable containers","Rising interest rates and declining reservoir levels"],"case_index":2},{"n":8,"stem":"Which analysis would best help FreshLoop judge whether expansion is viable?","options":["Count the favorable PESTEL factors and expand if they outnumber the unfavorable factors.","Compare sorting speeds only, because technology determines whether a service business can succeed.","Estimate demand, financing costs, and water-related operating constraints together before committing.","Treat the cafeterias’ stated interest as proof that revenues will cover all operating costs."],"case_index":2},{"n":9,"stem":"Holding other conditions constant, which effect of higher interest rates is most directly supported by the case?","options":["Cafeterias would become legally required to replace reusable containers with disposable ones.","The water needed to wash each container would fall because the loan is more expensive.","The same equipment loan would cost FreshLoop more to finance, making expansion harder to justify.","The new equipment would require more labor time for each container processed."],"case_index":2},{"n":10,"stem":"Which action in Case 4 most clearly illustrates the define stage of design thinking?","options":["Interviewing students and cafeteria staff about their experiences during lunch","Noticing students leave the cafeteria without food while Maya is waiting in line","Framing the challenge as helping students collect meals within a predictable time window","Drawing paper screens that show how students would choose a pickup slot"],"case_index":3},{"n":11,"stem":"What is the clearest reason that the basic working website qualifies as a minimum viable product?","options":["It performs the core ordering and pickup function and allows feedback from actual users.","It includes fewer visual elements than the paper sketches used by the team.","It offers enough optional features to compete with every established ordering platform.","It has already proved that every school cafeteria would benefit from adopting it."],"case_index":3},{"n":12,"stem":"Which next step best applies design thinking to the trial feedback?","options":["Add loyalty points immediately, because additional features resolve any usability problem.","Observe where students become confused, revise the pickup instructions, and test the changes.","Discard the ordering concept because a valid prototype should require no changes after testing.","Expand to every cafeteria before changing the site, so the original sequence is not interrupted."],"case_index":3},{"n":13,"stem":"Which description best classifies SecondStart’s organizational purpose?","options":["A public agency because it sells products through community learning centers","A conventional business whose social work is incidental to its stated primary goal of profit maximization","A nonprofit organization because reinvesting any profits prevents owners from receiving income","A social enterprise that uses commercial activity and profit to support a primary social objective"],"case_index":4},{"n":14,"stem":"Which statement best describes the relationship between SecondStart’s two quoted statements?","options":["Both are codes of conduct because each specifies rules for employee behavior.","Both are core competencies because each describes a strength rivals have difficulty copying.","The first is a vision describing a desired future; the second is a mission explaining how the organization serves its purpose.","The first is a mission describing current operations; the second is a vision describing a desired future."],"case_index":4},{"n":15,"stem":"Which feature of SecondStart most clearly represents a core competency?","options":["Its superior ability to diagnose and restore older laptops efficiently and reliably","Its aspiration that every learner should be able to participate digitally","Its expectation that staff disclose battery limitations during sales","Its belief that buyers should receive honest descriptions of laptop condition"],"case_index":4},{"n":16,"stem":"Using the largest-net-benefit approach and the estimates in Case 6, which decision is best supported?","options":["Choose neither system, because an optional measure cannot benefit stakeholders if current operations meet local rules.","Choose System B, because its $46,000 benefit should be compared directly with System A’s $18,000 cost.","Choose System A, because a lower initial cost necessarily produces a larger net benefit.","Choose System B, because its $17,000 net benefit exceeds System A’s $12,000 net benefit."],"case_index":5},{"n":17,"stem":"Which statement best explains why the residents belong in CedarWorks’s ethical analysis?","options":["They are internal stakeholders because their gardens are near the company’s workshop.","They can be excluded because compliance with rules resolves every ethical concern.","They become shareholders whenever a company’s activity changes their quality of life.","They are external stakeholders affected by production even though they do not work for the company."],"case_index":5},{"n":18,"stem":"Which change would most directly address the incentive problem behind concealed defects?","options":["Reward verified quality and timely defect reporting, and require supervisors to model those standards.","Print the existing handbook in a larger typeface while retaining the same output-only bonuses.","Increase the output bonus so employees have a stronger reason to ship cabinets quickly.","Stop collecting defect reports so supervisors no longer have to choose between quality and quantity."],"case_index":5},{"n":19,"stem":"Under the general-partnership model described in Unit 1, which risk applies to Elena and Marcus?","options":["Hiring an accounting firm automatically separates the partners’ personal assets from business obligations.","Only the partner who performs technical work bears responsibility for the business’s debts.","Outside shareholders must assume responsibility for debts before either partner can be liable.","The partners may be personally responsible for the partnership’s debts and obligations."],"case_index":6},{"n":20,"stem":"Which feature of LiftCare is the clearest example of outsourcing?","options":["The partners consider hiring their own employees for a new contract.","An independent accounting firm is paid to prepare LiftCare’s tax return.","Elena applies her technical expertise to customer maintenance jobs.","Marcus takes responsibility for scheduling and billing."],"case_index":6},{"n":21,"stem":"Which action would most directly address Elena’s concern about the proposed contract?","options":["Judge the bid only by expected sales because a larger contract necessarily provides enough cash to begin work.","Ask a marketing specialist to increase public awareness before estimating the contract’s costs.","Use last year’s tax return as proof that new tools and wages will be affordable before the first payment.","Obtain finance expertise to forecast payment timing, estimate funding needs, and assess how to cover any shortfall."],"case_index":6},{"n":22,"stem":"Which production approach best matches ClayRoute’s current mug business?","options":["Mass production, because café customers purchase more than one mug.","Artisan production, because skilled work and customization support the value customers seek.","Mass production, because a premium price requires standardized automated output.","Artisan production, because it eliminates the need for skilled workers and training."],"case_index":7},{"n":23,"stem":"Which supplier decision is most consistent with ClayRoute’s stated priorities?","options":["Choose Supplier A because proximity guarantees that ClayRoute will earn a profit on every order.","Choose Supplier B solely because its price per kilogram is lower.","Choose Supplier A because reliable quality and rapid delivery support the premium offer and changing orders.","Choose Supplier B because longer lead times inherently improve the quality of custom products."],"case_index":7},{"n":24,"stem":"Which statement correctly identifies a stage in ClayRoute’s service supply chain?","options":["ClayRoute has no service supply chain because workshops do not produce a standardized manufactured good.","Obtaining clay and an instructor is follow-up because both affect the customer experience.","Collecting participant feedback is sourcing because information is always a purchased input.","Collecting feedback and revising the next session are follow-up activities that can improve the service."],"case_index":7}],"key":["C","B","B","B","A","A","A","C","C","C","A","B","D","C","A","D","D","A","D","B","D","B","C","D"],"explanations":["The purchaser is the customer; the person who uses the product is the consumer. Here those roles belong to different people. A: This reverses buying and using. B: Payment does not make the parent the meal’s user. D: Being the intended user does not mean the child buys the meal.","The service addresses the specific delivery and dietary problems, and repeat paid purchases provide behavioral evidence that families value that solution. A: Lower competitor prices do not demonstrate fit for LunchLink. C: An operating requirement is not evidence that customers want the service. D: A familiar category does not show that this offer solves the target group’s problem.","Profit is price minus full cost: $10 − $7 = $3. Consumer surplus is willingness to pay minus price: $14 − $10 = $4. A: $7 is the business’s cost, and $3 is its profit rather than consumer surplus. C: $7 is willingness to pay minus cost, not the buyer’s surplus after paying $10. D: $10 is revenue, before costs are deducted.","TrailForm combines a narrow target market with distinctive fitting and repair services. That combination is differentiation focus. A: A premium price alone does not establish broad scope; this target market is narrow. C: Cost leadership requires a broad low-cost strategy, not simply a benefit that saves customers money. D: Cost focus competes through lower costs and prices in a niche; TrailForm charges a premium for uniqueness.","Exclusive access to a scarce, desirable input can make the product harder to imitate. The effect is limited to that input and the agreement’s duration. B: The case gives no evidence that material access eliminates the workshop’s cost disadvantage. C: Competing boots and other materials remain available; this is not a monopoly on footwear. D: The agreement does not guarantee future preferences or protection after expiration.","Removing custom fitting weakens the reason its niche customers choose it, while the workshop retains higher unit costs. This creates a risk of being stuck in the middle. B: Standard sizes do not create an exclusive input or scarce resource. C: Lower prices could attract buyers; the problem is competitive positioning and cost. D: A broader target does not require custom fitting; the issue is losing a coherent advantage.","Changing preferences are a social factor, while improved sorting equipment is a technological development. B: Borrowing costs are economic, not technological. C: Reservoir decline is environmental, and preferences are social rather than technological. D: Interest rates are economic; drought-related reservoir decline is environmental.","Viability depends on how external conditions affect this business’s customers, resources, and costs. A serious water constraint may outweigh several favorable trends. A: Factors differ in magnitude and relevance; a simple count ignores their effects. B: Technology matters, but demand, financing, and water availability also affect viability. D: Interest is weaker evidence than purchases and says nothing about full costs.","The case connects higher interest rates to the equipment loan. More expensive financing increases expansion costs without itself changing the equipment’s technical performance. A: No such legal requirement is stated or caused by a rate increase. B: Higher loan costs do not physically reduce water requirements. D: Interest rates do not directly change the machine’s labor requirements.","Defining means using information about users to articulate the central problem. Maya’s problem statement focuses the design on predictable pickup. A: Interviewing gathers user insights in the empathize stage. B: This is the initial observation that prompts investigation, not the articulated problem. D: The drawings are prototypes of a possible solution.","An MVP is a simple functional version that delivers its intended core benefit and enables customer feedback. Real orders and pickup slots meet that standard. B: Visual simplicity alone does not establish functionality. C: The site deliberately omits optional features; comprehensive features are not required for an MVP. D: A small trial does not prove universal demand or fit.","Design thinking is iterative. Targeted observation and revision address the reported difficulty, and another test checks whether the change works. A: Loyalty points do not address confusing pickup instructions. C: Testing commonly reveals improvements; a fixable issue does not invalidate the entire concept. D: The process can return to earlier stages; completing a sequence is not the objective.","Its primary purpose is social, but it sells products and can earn and distribute profit. That fits Unit 1’s description of a social enterprise. A: Using community centers as a channel does not establish government ownership. B: The stated primary objective is affordable access, not profit maximization. C: The case explicitly permits owner distributions; reinvestment alone does not establish nonprofit status.","The first statement describes the future impact SecondStart hopes to achieve. The second describes its present work, offer, and route to serving learners. A: These are purpose statements, not specific rules of conduct. B: Neither statement demonstrates a capability relative to competitors. D: This reverses the future aspiration and current activity.","The repair team’s demonstrated expertise is a capability that helps the business outperform rivals and deliver value. B: This is a vision or aspiration, not an existing capability. C: Disclosure is an expected behavior expressing the honesty value. D: Honesty is a guiding value rather than the described technical capability.","A yields $30,000 − $18,000 = $12,000. B yields $46,000 − $29,000 = $17,000. Under the stated criterion and complete estimates, B has the greater net benefit. A: Compliance does not eliminate additional benefits from reducing harm. B: Each option’s own costs must be subtracted from its own benefits. C: Net benefit depends on benefits as well as costs.","People outside a business who are affected by its activities are external stakeholders. The dust affects the residents whether or not they buy cabinets or own shares. A: Geographic proximity does not make residents employees, managers, or owners. B: Legal compliance alone does not settle every conflict between values and business goals. C: Being affected by a company does not grant ownership.","The existing incentives and supervisors’ conduct undermine the written rule. Aligning rewards and visible leadership behavior with honest reporting addresses that cause. B: Workers already have the rule; changing its display leaves conflicting incentives in place. C: A larger output-only reward strengthens the pressure associated with concealment. D: Removing information hides the problem rather than improving conduct.","General partners have personal liability for partnership obligations. Dividing work or hiring outside specialists does not itself create limited liability. A: Outsourcing a task does not change the legal structure. B: Responsibility is not restricted to the partner doing technical tasks. C: The case describes a partnership, not a corporation with shareholders.","Outsourcing hires another business to carry out a function. The independent accounting firm performs such a function for LiftCare. A: Direct employees would be part of LiftCare rather than an outsourced business. C: A partner performing the business’s work is an internal activity. D: Dividing responsibilities between owners is not hiring an outside firm.","Finance planning examines the funds needed and their timing. A profitable-looking opportunity can still require tools and wages before customer payments arrive. A: Sales size alone does not establish the availability or timing of funds. B: Marketing does not resolve the immediate funding gap. C: A historical tax return does not forecast the new project’s payment and spending schedule.","Small batches, hand-shaping, specialized skills, and custom finishes fit artisan production. Those attributes help justify the higher price, though they constrain speed and scale. A: An order containing multiple units does not make the process mass production. C: Premium pricing does not require automation, and this case explicitly uses handcrafting. D: Artisan production depends on skill and can require substantial training.","Supplier A better supports consistent finishes and responsiveness. Its higher input price is a tradeoff to weigh against quality and delivery risks, not a reason to ignore those risks. A: Proximity helps responsiveness but cannot guarantee profit. B: Price alone ignores quality and lead time, both central to this strategy. D: The case reports inconsistent quality; longer shipping time does not improve it.","The service supply chain includes planning, sourcing, delivery, and follow-up. Gathering feedback after delivery and using it to refine the service are follow-up activities. A: Services also require coordinated inputs and delivery processes. B: Obtaining the required people and supplies is sourcing. C: Feedback collected after a workshop is follow-up in this sequence; it need not be purchased."]};
const questions=bank.questions, answerKey=bank.key, explanations=bank.explanations, poemLines=bank.lines;
const total=questions.length, limit=bank.minutes*60;
const STORE=bank.storage_id;
const fresh=()=>({answers:Array(total).fill(null),flags:Array(total).fill(false),confidence:Array(total).fill(null),index:0,view:'question',seconds:limit,deadline:null,submitted:false,notes:'',elapsed:0,startedAt:null});
let state=fresh(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&Array.isArray(saved.answers)&&saved.answers.length===total&&saved.answers.every(a=>a===null||'ABCD'.includes(a))&&Array.isArray(saved.flags)&&saved.flags.length===total&&Array.isArray(saved.confidence)&&saved.confidence.length===total&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<total&&['question','review','results'].includes(saved.view)&&Number.isFinite(saved.seconds)&&saved.seconds>=0&&saved.seconds<=limit)state=Object.assign(fresh(),saved)}catch(e){storageOK=false}
state.deadline=null;state.seconds=limit;
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){storageOK=false}}
function timerUpdate(){}
let displayedCase=-1;
function showCase(index){const c=bank.cases[index];if(displayedCase===index)return;displayedCase=index;el('case-title').textContent=c.title;el('poem').innerHTML=c.paragraphs.map(p=>'<p class="case-paragraph">'+esc(p)+'</p>').join('');document.querySelector('.passage').scrollTop=0;}
showCase(questions[state.index].case_index);
function mobileView(poem){document.body.classList.toggle('show-poem',poem);el('poem-tab').setAttribute('aria-selected',poem);el('question-tab').setAttribute('aria-selected',!poem)}
el('poem-tab').onclick=()=>mobileView(true);el('question-tab').onclick=()=>mobileView(false);
function go(n){state.index=n;state.view='question';save();render();el('panel').scrollTop=0;mobileView(false)}
function score(){return state.answers.reduce((total,a,i)=>total+(a===answerKey[i]?1:0),0)}
function nav(){el('progress').textContent=state.answers.filter(Boolean).length+' of '+total+' answered';el('back').disabled=state.view==='question'&&state.index===0;el('back').textContent=state.view==='question'?'Back':'Questions';el('next').textContent=state.view==='question'?(state.index===total-1?(state.submitted?'Results':'Review answers'):'Next'):(state.submitted?'Review explanations':'Return to question');el('review').textContent=state.submitted?'Results':'Review answers';}
function render(){
nav();timerUpdate();showCase(questions[state.index].case_index);const panel=el('panel');
if(state.view==='review'){renderReview();return}if(state.view==='results'){renderResults();return}
const q=questions[state.index],a=state.answers[state.index],i=state.index;
panel.innerHTML='<div class="q-head"><h2 id="question-title">Question '+q.n+' of '+total+'</h2><label class="flag-label"><input id="flag" type="checkbox" '+(state.flags[i]?'checked':'')+'>Mark for review</label></div><p class="stem" id="stem">'+esc(q.stem)+'</p><div class="options" role="radiogroup" aria-labelledby="stem">'+q.options.map((text,k)=>{const l=String.fromCharCode(65+k);return '<button class="option" role="radio" aria-checked="'+(a===l)+'" data-choice="'+l+'" '+(state.submitted?'disabled':'')+'><span class="letter">'+l+'</span><span class="option-text">'+esc(text)+'</span></button>'}).join('')+'</div>'+
(!state.submitted?'<div class="confidence"><p>Confidence (optional)</p><div class="segments">'+['Low','Medium','High'].map(c=>'<button data-confidence="'+c+'" aria-pressed="'+(state.confidence[i]===c)+'">'+c+'</button>').join('')+'</div></div><div class="utility"><span>'+(!storageOK?'Browser storage unavailable; keep this page open.':'Progress saved in this browser')+'</span><button class="textbutton" id="clear">Clear answer</button></div>':'<div class="feedback"><strong class="'+(a===answerKey[i]?'correct':'incorrect')+'">'+(a===answerKey[i]?'Correct':a?'Your answer: '+a:'Unanswered')+' · Answer: '+answerKey[i]+'</strong>'+esc(explanations[i])+'</div>');
el('flag').onchange=e=>{state.flags[i]=e.target.checked;save()};
panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.answers[i]=b.dataset.choice;save();render();el('panel').querySelector('[data-choice="'+state.answers[i]+'"]').focus({preventScroll:true})});
panel.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{state.confidence[i]=state.confidence[i]===b.dataset.confidence?null:b.dataset.confidence;save();render();el('panel').querySelector('[data-confidence="'+b.dataset.confidence+'"]').focus({preventScroll:true})});
if(el('clear'))el('clear').onclick=()=>{state.answers[i]=null;save();render()};
}
function grid(results){return '<div class="review-grid">'+questions.map((q,i)=>'<button class="review-cell '+(state.answers[i]?'answered ':'')+(state.flags[i]?'flagged':'')+'" data-go="'+i+'"><b>'+q.n+'</b><small>'+(results?(state.answers[i]===answerKey[i]?'Correct':state.answers[i]?'Review':'Unanswered'):(state.answers[i]?'Answer '+state.answers[i]:'Unanswered'))+(state.flags[i]?' · Flagged':'')+'</small></button>').join('')+'</div>'}
function bindGrid(){el('panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)))}
function renderReview(){
const unanswered=total-state.answers.filter(Boolean).length,flags=state.flags.filter(Boolean).length;
el('panel').innerHTML='<h2>Review your answers</h2><p class="review-intro">'+unanswered+' unanswered · '+flags+' marked for review. Select a question to return to it.</p>'+grid(false)+'<p class="review-note">A gold top border marks questions you flagged. You can change any answer before submitting.</p><label class="notes-label" for="notes">Any words you did not know? <span class="review-note">(optional)</span></label><textarea id="notes" placeholder="Note unfamiliar business terms or parts of the case that were unclear.">'+esc(state.notes)+'</textarea><div class="review-actions"><button id="submit" class="primary">Submit '+(unanswered?'with '+unanswered+' unanswered':'answers')+'</button><button id="return">Keep working</button></div><p class="review-note">Submission locks this attempt and shows your score. Explanations stay closed until you choose to review them.</p>';
bindGrid();el('notes').oninput=e=>{state.notes=e.target.value;save()};el('return').onclick=()=>go(state.index);
el('submit').onclick=()=>{timerUpdate();state.deadline=null;state.submitted=true;state.elapsed=limit-state.seconds;state.view='results';save();render();el('panel').scrollTop=0};
}
function summary(){return 'AP Business Practice — '+bank.title+'\nSet: '+bank.id+'\nRevision: '+bank.revision+'\nScore: '+score()+'/'+total+' ('+Math.round(score()/total*100)+'%)\nTimed minutes used: '+(state.elapsed/60).toFixed(1)+' (timer optional)\n\n'+questions.map((q,i)=>q.n+': '+(state.answers[i]||'Unanswered')+' | confidence: '+(state.confidence[i]||'not recorded')+' | flagged: '+(state.flags[i]?'yes':'no')).join('\n')+'\n\nUnfamiliar words: '+(state.notes||'none recorded')+'\n\nPlease diagnose my answers, separating terminology gaps from errors applying business concepts.'}
function renderResults(){
el('panel').innerHTML='<h2>Practice complete</h2><div class="score">'+score()+' / '+total+' <span>'+Math.round(score()/total*100)+'%</span></div><p class="result-info">This is your score for this practice set, not a predicted AP exam score. Your first-attempt answers are saved.</p><div class="review-actions"><button id="explain" class="primary">Review explanations</button><button id="copy">Copy results for tutor</button><button id="download">Download answers</button></div><p id="copy-status" class="status" role="status">Bring your answers back to our conversation for a closer diagnosis.</p><details><summary>View answer summary</summary><textarea id="result-summary" readonly>'+esc(summary())+'</textarea></details>'+grid(true)+'<button class="textbutton" id="restart">Start a new attempt</button>';
bindGrid();el('explain').onclick=()=>go(Math.max(0,state.answers.findIndex((a,i)=>a!==answerKey[i])));
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());el('copy-status').textContent='Copied. Paste the results into our conversation.'}catch(e){const d=el('result-summary');d.parentElement.open=true;d.focus();d.select();el('copy-status').textContent='Select and copy the answer summary below.'}};
el('download').onclick=()=>{const blob=new Blob([summary()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=bank.id+'-answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('restart').onclick=()=>{const box=document.createElement('div');box.className='review-actions';box.innerHTML='<p class="review-note">Starting again clears this attempt. Download your answers first if you want to keep them.</p><button id="confirm-restart" class="primary">Clear attempt and start again</button><button id="cancel-restart">Keep this attempt</button>';el('restart').replaceWith(box);el('confirm-restart').onclick=()=>{state=fresh();save();render();el('panel').scrollTop=0};el('cancel-restart').onclick=()=>renderResults();box.scrollIntoView({block:'nearest'});};
}
el('back').onclick=()=>go(state.view==='question'?Math.max(0,state.index-1):state.index);
el('next').onclick=()=>{if(state.view==='question'){if(state.index<total-1)go(state.index+1);else{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0}}else if(state.submitted){go(0)}else go(state.index)};
el('review').onclick=()=>{state.view=state.submitted?'results':'review';save();render();el('panel').scrollTop=0;mobileView(false)};
render();
</script></body></html>
